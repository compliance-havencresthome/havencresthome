<style>
:root{--bg:#f6f9ff;--surface:#ffffff;--ink:#0d0f14;--muted:#5b6472;--line:#e3eaf6;--blue:#1a6ff0;--blue-dark:#0f52c9;--blue-light:#5f9bf5;--tint:#eaf1fd;--on-blue:#fff;--good:#1e8e5a;--good-soft:#e3f5ec;--bad:#d64545;--warm-soft:#fff1dc;--warm-ink:#9a5b00;
 --display:Poppins,system-ui,sans-serif;--body:"Nunito Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--surface:#151d2c;--ink:#f1f4fa;--muted:#aab4c6;--line:#27344b;--blue:#3b84f5;--blue-dark:#2f6fd6;--tint:#172238;--good-soft:#14301f;--warm-soft:#2b2416;--warm-ink:#f3c57a}}
:root[data-theme="dark"]{--bg:#0e1420;--surface:#151d2c;--ink:#f1f4fa;--muted:#aab4c6;--line:#27344b;--blue:#3b84f5;--blue-dark:#2f6fd6;--tint:#172238;--good-soft:#14301f;--warm-soft:#2b2416;--warm-ink:#f3c57a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);min-height:100dvh}
h1,h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.1;letter-spacing:-.02em}
h1:focus{outline:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg)}
.top .in{max-width:1100px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:1rem;text-decoration:none;color:var(--ink)}
.brand svg{width:26px;height:26px}
.call{margin-left:auto;text-decoration:none;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.call svg{width:18px;height:18px}.call span{display:none}@media(min-width:560px){.call span{display:inline}}

.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}

.meta{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--muted)}
.meta b{color:var(--ink)}
.secs{display:none;gap:4px;list-style:none;margin:2px 0 0;padding:0}
.secs button{border:0;background:transparent;font:inherit;font-size:.74rem;font-weight:700;color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.secs button.done{color:var(--good)}.secs button.cur{background:var(--tint);color:var(--blue)}.secs button:disabled{cursor:default;opacity:.7}
@media(min-width:720px){.secs{display:flex}}
/* layout */
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 150px;display:grid;gap:36px}
@media(min-width:960px){.wrap{grid-template-columns:minmax(0,620px) 280px;justify-content:center;padding-top:34px;gap:60px}}
main{min-width:0}
.screen{animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen{animation:none}}
.kicker{color:var(--blue);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.74rem;margin:0 0 8px}
h1{font-size:clamp(1.65rem,5vw,2.15rem);margin-bottom:10px}
h1 em{font-style:normal;color:var(--blue)}
.lead{color:var(--muted);font-size:1.05rem;margin:0 0 24px}
/* option cards */
.opts{display:grid;gap:12px}
.opt{display:grid;grid-template-columns:48px 1fr auto;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer;min-height:64px;transition:all .15s}
.opt i{grid-row:1/3;font-style:normal;font-size:1.5rem;width:48px;height:48px;border-radius:14px;background:var(--tint);display:grid;place-items:center}
.opt b{grid-column:2;grid-row:1;font-size:1.08rem;line-height:1.2;align-self:end}.opt span{grid-column:2;grid-row:2;color:var(--muted);font-size:.9rem;line-height:1.3;align-self:start}.opt span:empty{display:none}.opt b:last-child,.opt b:has(+em){grid-row:1/3;align-self:center}
.opt em{grid-column:3;grid-row:1/3;font-style:normal;font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap}
.opt.noicon{grid-template-columns:1fr auto}.opt.noicon i{display:none}.opt.noicon b,.opt.noicon span{grid-column:1}.opt.noicon em{grid-column:2}
.opt:hover{border-color:var(--blue-light)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--tint);box-shadow:0 8px 24px rgba(26,111,240,.14)}
.opt[aria-pressed="true"] em{color:var(--blue)}

.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{min-height:50px;padding:10px 18px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;cursor:pointer;transition:all .15s}
.pill:hover{border-color:var(--blue-light)}
.pill[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.pill:focus-visible,.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sub{font-weight:700;margin:22px 0 10px;font-size:1rem}.sub:first-child{margin-top:0}
/* fields */
.grid{display:grid;gap:14px}@media(min-width:600px){.grid.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.f{display:grid;gap:6px}.f>label{font-weight:700;font-size:.95rem}.f small{color:var(--muted);font-weight:400;font-size:.85rem}
.f input,.f select,.f textarea{min-height:52px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);width:100%;font-size:1.05rem;transition:border-color .15s,box-shadow .15s}
.f textarea{min-height:120px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--tint)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}
.msg{font-size:.88rem;color:var(--bad);font-weight:600;display:none}.f.err .msg,.msg.on{display:block}
.hint{font-size:.88rem;color:var(--muted)}
.flag{background:var(--warm-soft);color:var(--warm-ink);border-radius:14px;padding:12px 16px;font-size:.95rem;margin-top:16px}
.flag.good{background:var(--good-soft);color:var(--good)}
/* estimate */
.est{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px}
.est .big{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--blue);line-height:1}
.est .big small{font-size:1rem;color:var(--muted);font-weight:700;margin-left:6px}
.est .rows{display:grid;gap:6px;font-size:.95rem}
.est .rows div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.est .rows div:last-child{border:0;font-weight:700}
.est .rows span:last-child{white-space:nowrap}
/* review */
.rev{display:grid;gap:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.rev .row{display:grid;grid-template-columns:120px 1fr auto;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.95rem;align-items:start}
.rev .row:last-child{border:0}.rev .row b{color:var(--muted);font-weight:700}.rev .row a{font-weight:700;text-decoration:none}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:var(--surface);min-height:56px}
.chk input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--blue)}.chk.err{border-color:var(--bad)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.nav .in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center}
@media(min-width:960px){.nav .in{width:620px;margin:0 auto;transform:translateX(-170px)}}
.btn{min-height:54px;padding:12px 24px;border-radius:14px;border:0;font-family:var(--display);font-weight:800;font-size:1.05rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:all .15s}
.btn.primary{background:var(--blue);color:var(--on-blue);flex:1}.btn.primary:hover{background:var(--blue-dark)}
.btn.ghost{background:var(--tint);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.saved{font-size:.78rem;color:var(--muted);font-weight:700;white-space:nowrap;display:none}@media(min-width:600px){.saved{display:block}}
/* rail */
aside{display:none}@media(min-width:960px){aside{display:block;position:sticky;top:110px;align-self:start}}
.rail{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px}
.rail h2{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail li button{width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:10px;display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600;color:var(--muted);min-height:42px}
.rail li button.cur{background:var(--tint);color:var(--blue);font-weight:700}.rail li button:disabled{cursor:default}
.dot{flex:0 0 22px;width:22px;height:22px;min-height:22px;align-self:center;box-sizing:border-box;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.72rem;font-weight:800;flex:none}
.dot.done{background:var(--good);border-color:var(--good);color:#fff}.dot.cur{border-color:var(--blue);color:var(--blue)}
.rail .st{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.rail .help{background:var(--tint);border-radius:12px;padding:12px;font-size:.9rem}.rail .help a{font-weight:800;text-decoration:none}
.resume{display:grid;gap:8px;margin-top:8px}.resume input{min-height:44px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
.resume .btn{min-height:44px;font-size:.9rem;padding:8px 14px}

.finish{text-align:center;padding:20px 0}
.finish .big{width:88px;height:88px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 18px}.finish .big svg{width:44px;height:44px}
.next{display:grid;gap:10px;text-align:left;margin:22px 0}
.next div{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;transition:opacity .2s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
</style>

var TASK_SCREENS=TASKS.map(function(t){ return {sec:3,id:'lv_'+t[0],task:t,when:function(){return (S.d.tasks_sel||[]).indexOf(t[0])>=0},h:function(){return 'How much help with <em>'+esc(t[0].toLowerCase())+'</em>?'},l:'Tap the closest answer. Nothing is final until we meet.',body:function(){ var k='lv_'+t[0]; if(!S.d[k]) S.d[k]='Standby / cueing'; return cards(k,LEVELS.map(function(L){ var h=L[4]?Math.round(t[2]*t[3]*t[4]/60*L[4]*10)/10:0; return {v:L[0],t:L[1],s:L[2],ic:L[3],e:h?('~'+h+' h/wk'):''}; })); },auto:true}; });
var ti=SCREENS.findIndex(function(s){return s.id==='tasks'}); SCREENS.splice.apply(SCREENS,[ti+1,0].concat(TASK_SCREENS));

function visible(){ return SCREENS.filter(function(s){return !s.when||s.when()}); }

/* ---------- persistence ---------- */
function load(){ try{ var o=JSON.parse(localStorage.getItem(KEY)||'null'); if(o){ S.d=o.d||S.d; S.i=o.i||0; S.maxSeen=o.maxSeen||0; S.ts=o.ts||null; } }catch(e){} }
var saveT; function save(now){ clearTimeout(saveT); saveT=setTimeout(function(){ try{ S.ts=Date.now(); localStorage.setItem(KEY,JSON.stringify({d:S.d,i:S.i,maxSeen:S.maxSeen,ts:S.ts})); savedLbl(); }catch(e){} }, now?0:400); }
function savedLbl(){ var t=S.ts?new Date(S.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):''; $('#saved').textContent=t?'Saved '+t:''; $('#railSt').innerHTML=t?'<b>Saved on this device</b> · '+t+'<br>Come back any time to finish.':'Autosaves as you go.'; }

/* ---------- render ---------- */
function render(){
  var vis=visible(); if(S.i>=vis.length) S.i=vis.length-1; var sc=vis[S.i]; S.maxSeen=Math.max(S.maxSeen,S.i);
  var h=typeof sc.h==='function'?sc.h():sc.h;
  $('#screen').innerHTML='<p class="kicker">'+esc(SECTIONS[sc.sec])+'</p><h1 tabindex="-1">'+h+'</h1>'+(sc.l?'<p class="lead">'+sc.l+'</p>':'')+sc.body();
  var el=$('#screen'); el.classList.remove('screen'); void el.offsetWidth; el.classList.add('screen');
  // progress
  $('#barFill').style.width=Math.max(3,Math.round(100*(S.i+1)/vis.length))+'%';
  $('#metaL').innerHTML='Question <b>'+(S.i+1)+'</b> of '+vis.length; $('#metaR').textContent=Math.max(1,Math.round((vis.length-S.i-1)*0.3))+' min left';
  paintSections(vis,sc);
  $('#back').style.visibility=S.i===0?'hidden':''; $('#next').textContent=sc.submit?'Send to Haven Crest':'Continue →';
  bindScreen(sc);
  window.scrollTo({top:0,behavior:'smooth'}); var hh=$('#screen h1'); if(hh&&S.i>0) hh.focus({preventScroll:true});
  save(true);
}
function paintSections(vis,sc){
  var firstIdx=SECTIONS.map(function(_,si){ return vis.findIndex(function(s){return s.sec===si}); });
  var html=SECTIONS.map(function(n,si){ var st=si<sc.sec?'done':si===sc.sec?'cur':''; var can=firstIdx[si]>=0&&firstIdx[si]<=S.maxSeen; return '<li><button type="button" data-sec="'+si+'" class="'+st+'"'+(can?'':' disabled')+'><span class="dot '+st+'">'+(st==='done'?'&#10003;':si+1)+'</span>'+esc(n)+'</button></li>'; }).join('');
  $('#rail').innerHTML=html; $('#secs').innerHTML=SECTIONS.map(function(n,si){ var st=si<sc.sec?'done':si===sc.sec?'cur':''; var can=firstIdx[si]>=0&&firstIdx[si]<=S.maxSeen; return '<li><button type="button" data-sec="'+si+'" class="'+st+'"'+(can?'':' disabled')+'>'+(st==='done'?'✓ ':'')+esc(n)+'</button></li>'; }).join('');
  $$('[data-sec]').forEach(function(b){ b.addEventListener('click',function(){ var idx=firstIdx[+b.dataset.sec]; if(idx>=0&&idx<=S.maxSeen){ S.i=idx; render(); } }); });
}
function bindScreen(sc){
  var root=$('#screen');
  $$('input,select,textarea',root).forEach(function(i){ if(!i.dataset.k) return; i.addEventListener('input',function(){ S.d[i.dataset.k]=i.type==='checkbox'?i.checked:i.value; if(i.closest('.f.err')) validateField(i); if(i.dataset.k==='consent_contact'||i.dataset.k==='consent_share'){ $('#consentMsg').classList.remove('on'); i.closest('.chk').classList.remove('err'); } conditionals(); save(); }); i.addEventListener('blur',function(){ validateField(i); }); });
  $$('input[data-type="phone"]',root).forEach(function(i){ i.addEventListener('input',function(){ var d=this.value.replace(/\D/g,'').slice(0,10); this.value=d.length>6?d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6):d.length>3?d.slice(0,3)+'-'+d.slice(3):d; S.d[this.dataset.k]=this.value; }); });
  var z=$('#f_zip',root); if(z){ var zt; z.addEventListener('input',function(){ var v=this.value.replace(/\D/g,'').slice(0,5); this.value=v; S.d.zip=v; clearTimeout(zt); if(v.length===5) zt=setTimeout(function(){lookupZip(v)},250); }); }
  var c=$('#f_city',root); if(c) c.addEventListener('input',function(){ S.d._cityAuto=false; });
  var nt=$('#noTasks',root); if(nt) nt.addEventListener('click',function(){ var on=this.getAttribute('aria-pressed')!=='true'; this.setAttribute('aria-pressed',on); S.d.just_checking=on?'Yes':''; if(on){ S.d.tasks_sel=[]; $$('[data-field="tasks_sel"] .pill',root).forEach(function(p){p.setAttribute('aria-pressed','false')}); } save(); });
  var first=$('input:not([type=checkbox]),textarea',root); if(first&&window.innerWidth>700&&!/date/.test(first.type)) setTimeout(function(){first.focus({preventScroll:true})},300);
  conditionals();
}
document.addEventListener('click',function(e){
  var p=e.target.closest('[data-field] .pill, [data-field] .opt'); if(!p) return;
  var g=p.closest('[data-field]'),k=g.dataset.field;
  if(g.hasAttribute('data-multi')){ var arr=Array.isArray(S.d[k])?S.d[k].slice():[]; var on=p.getAttribute('aria-pressed')!=='true'; var v=p.dataset.v; var solo=/^(Nothing special|Flexible|Walks without help)$/;
    if(on){ if(solo.test(v)) arr=[]; else arr=arr.filter(function(x){return !solo.test(x)}); arr.push(v); } else arr=arr.filter(function(x){return x!==v});
    if(k==='tasks_sel'&&arr.length){ S.d.just_checking=''; var nt=$('#noTasks'); if(nt) nt.setAttribute('aria-pressed','false'); }
    S.d[k]=arr; $$('.pill,.opt',g).forEach(function(q){ q.setAttribute('aria-pressed',arr.indexOf(q.dataset.v)>=0); });
  } else { S.d[k]=p.dataset.v; $$('.pill,.opt',g).forEach(function(q){ q.setAttribute('aria-pressed',q===p); }); var sc=visible()[S.i]; if(sc.auto&&g.classList.contains('opts')){ save(); setTimeout(next,220); return; } }
  conditionals(); save();
});
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){ e.preventDefault(); next(); } });
function conditionals(){
  var sf=$('#stateFlag'); if(sf) sf.style.display=(S.d.state&&S.d.state!=='WI')?'':'none';
  var cf=$('#cgFlag'); if(cf){ var rel=S.d.caregiver_relationship||''; var warn=/Spouse|guardian/i.test(rel); cf.innerHTML=rel?'<div class="flag'+(warn?'':' good')+'">'+(warn?'Spouses and legal guardians can be paid caregivers only in some situations. We’ll confirm with the care manager before promising anything.':'Great. Your caregiver will complete a background check, hire paperwork and short competency training before the first paid visit.')+'</div>':''; }
}
function lookupZip(z){
  var h=$('#h_zip'); if(h) h.textContent='Looking up…';
  fetch('https://api.zippopotam.us/us/'+z).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){ var p=j.places&&j.places[0]; if(!p) throw 0;
    if(!S.d.city||S.d._cityAuto){ S.d.city=p['place name']; S.d._cityAuto=true; var c=$('#f_city'); if(c) c.value=S.d.city; }
    var st=p['state abbreviation']; S.d.state=['WI','MN','MI','IA','IL'].indexOf(st)>=0?st:'Other'; var se=$('#f_state'); if(se) se.value=S.d.state;
    var cty=ZIP_COUNTY[z]; if(st==='WI'&&cty&&!S.d.county){ S.d.county=cty; var ce=$('#f_county'); if(ce) ce.value=cty; }
    if(h) h.textContent=p['place name']+', '+st+' — edit if needed.'; conditionals(); save();
  }).catch(function(){ var cty=ZIP_COUNTY[z]; if(cty&&!S.d.county){ S.d.county=cty; var ce=$('#f_county'); if(ce) ce.value=cty; } if(h) h.textContent='Enter the city'+(cty?'':' and county')+' below.'; });
}

/* ---------- validation ---------- */
function setErr(el,on){ var f=el.closest('.f'); if(f) f.classList.toggle('err',!!on); return !on; }
function validateField(i){
  var v=(i.value||'').trim(),t=i.dataset.type;
  if(i.required&&i.type!=='checkbox'&&!v) return setErr(i,true);
  if(!v) return setErr(i,false);
  if(t==='phone'&&v.replace(/\D/g,'').length!==10) return setErr(i,true);
  if(t==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return setErr(i,true);
  if(t==='zip'&&!/^\d{5}$/.test(v)) return setErr(i,true);
  if(t==='dob'){ var dt=new Date(v),now=new Date(); if(isNaN(dt)||dt>now||now.getFullYear()-dt.getFullYear()>120) return setErr(i,true); }
  return setErr(i,false);
}
function validateScreen(sc){
  var ok=true,first=null;
  $$('#screen input,#screen select,#screen textarea').forEach(function(i){ if(i.type==='checkbox') return; if(!validateField(i)){ ok=false; first=first||i; } });
  if(ok&&sc.valid&&!sc.valid()) ok=false;
  if(!ok){ if(first){ first.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(function(){first.focus({preventScroll:true})},300); toast('Please check the highlighted field'); } }
  return ok;
}

/* ---------- navigation ---------- */
function next(){ if(S.done) return; var vis=visible(); var sc=vis[S.i]; if(!validateScreen(sc)) return; if(sc.submit){ submit(); return; } if(S.i<vis.length-1){ S.i++; render(); } }
$('#next').addEventListener('click',next); $('#back').addEventListener('click',function(){ if(S.i>0){ S.i--; render(); } });

/* ---------- review ---------- */
function review(){
  var d=S.d,e=estimate(); var j=function(a){return Array.isArray(a)?a.join(', '):(a||'')}; var vis=visible(); var at=function(id){ var i=vis.findIndex(function(s){return s.id===id}); return i<0?0:i; };
  var rows=[['You',[d.first_name,d.last_name].filter(Boolean).join(' ')+(d.reaching_as?' · '+d.reaching_as:'')+(d.referrer_org?' · '+d.referrer_org:''),'name'],['Contact',[d.phone,d.email].filter(Boolean).join(' · ')+(d.best_time?' · '+d.best_time:''),'contact'],['Timing',d.start_timing,'timing'],
   ['Member',[d.m_first,d.m_last].filter(Boolean).join(' ')+(d.member_dob?' · DOB '+d.member_dob:''),'member'],['Home',[d.address,d.city,d.state,d.zip].filter(Boolean).join(', ')+(d.county?' · '+d.county+' County':''),'address'],['Lives with',(d.lives_with||'—')+' · '+(d.language||'English'),'living'],
   ['Coverage',[d.program,d.mco||d.ica].filter(Boolean).join(' · ')+(d.plan_status?' · '+d.plan_status:'')+(d.budget?' · '+d.budget+'/wk':''),'program'],['Care manager',[d.cm_name,d.cm_phone,d.cm_email].filter(Boolean).join(' · ')||'—','payer'],
   ['Support',(e.lines.map(function(l){return l.name+' ('+l.level+')'}).join('; ')||(d.just_checking==='Yes'?'Just checking for now':'—')),'tasks'],['Weekly plan',e.base?e.total+' hrs/week (incl. '+e.cushion+' h cushion)':'—','estimate'],['Mobility',j(d.mobility)||'—','mobility'],['Schedule',[j(d.pref_days),j(d.pref_time)].filter(Boolean).join(' · ')||'—','schedule'],
   ['Home notes',[j(d.home_flags),d.pets?'Pets: '+d.pets:'',d.home_access?'Access: '+d.home_access:''].filter(Boolean).join(' · ')||'—','home'],['Emergency',[d.ec_name,d.ec_relationship,d.ec_phone].filter(Boolean).join(' · '),'ec'],
   ['Caregiver',d.caregiver_has==='No'?'Please match us':[d.caregiver_has,d.caregiver_name,d.caregiver_relationship].filter(Boolean).join(' · ')||'—','cg']];
  setTimeout(function(){ $$('[data-go]').forEach(function(a){ a.addEventListener('click',function(ev){ ev.preventDefault(); S.i=at(a.dataset.go); render(); }); }); },0);
  return '<div class="rev">'+rows.map(function(r){return '<div class="row"><b>'+r[0]+'</b><span>'+esc(r[1]||'—')+'</span><a href="#" data-go="'+r[2]+'">Edit</a></div>'}).join('')+'</div>';
}

/* ---------- submit ---------- */
function payload(){
  var d=S.d,e=estimate();
  var tasks=TASKS.map(function(t){ return {name:t[0],level:S.d['lv_'+t[0]]&&(d.tasks_sel||[]).indexOf(t[0])>=0?S.d['lv_'+t[0]]:'None',minutes:t[2],perDay:t[3],daysWeek:t[4]}; });
  var intake={member_name:[d.m_first,d.m_last].filter(Boolean).join(' '),member_dob:d.member_dob,member_phone:d.member_phone||'',member_email:d.reaching_as==='The person who needs support'?d.email:'',address:[d.address,d.zip].filter(Boolean).join(' '),city:d.city,county:d.county,language:d.language||'English',lives_with:d.lives_with||'',pets:d.pets||'',home_access:d.home_access||'',ec_name:d.ec_name,ec_phone:d.ec_phone,
    safety_notes:[Array.isArray(d.home_flags)?d.home_flags.join(', '):'',Array.isArray(d.mobility)?'Mobility: '+d.mobility.join(', '):'',d.safety_notes||''].filter(Boolean).join('\n'),
    program:d.program,mco:d.mco||d.ica||'',medicaid_id:d.medicaid_id||'',cm_name:d.cm_name||'',cm_phone:d.cm_phone||'',cm_email:d.cm_email||'',auth_status:d.plan_status==='Yes, hours are authorized'?'Authorized':d.plan_status==='In progress'?'Requested':'Not requested',plan_on_file:d.plan_status==='Yes, hours are authorized'?'Yes':'No',consent_contact:'Yes',
    tasks:tasks,est_hours_base:e.base,cushion_hours:e.cushion,est_hours_week:e.total,est_hours_day:e.day,start_date:'',pref_days:Array.isArray(d.pref_days)?d.pref_days.join('/'):'',pref_time:Array.isArray(d.pref_time)?d.pref_time.join(', '):'',schedule_notes:d.schedule_notes||'',
    caregiver_has:d.caregiver_has||'No',caregiver_name:d.caregiver_name||'',caregiver_phone:d.caregiver_phone||'',caregiver_relationship:d.caregiver_relationship||'',caregiver_exp:d.caregiver_exp||'',caregiver_consent:'Not asked',visit_type:'Virtual first, in-person within 30 days',
    call_notes:'Web intake (conversational). Best time: '+(d.best_time||'any')+'. Budget: '+(d.budget||'n/a')+'. Emergency contact relationship: '+(d.ec_relationship||'')+'. Estimate '+e.base+' h + '+e.cushion+' h cushion = '+e.total+' h/wk. Signed by '+(d.signed_name||'')+' on '+new Date().toLocaleString()+'. Consent to contact: yes. Consent to share with care team: yes.'};
  return {form:'intake',source:'Website intake',name:[d.first_name,d.last_name].filter(Boolean).join(' '),phone:d.phone,email:d.email||'',city:d.city,county:d.county,reaching_as:d.reaching_as,start_timing:d.start_timing,referrer_org:d.referrer_org||'',
    member_name:intake.member_name,member_dob:d.member_dob,program:d.program,mco:intake.mco,hours_week:String(e.total||''),
    need:(e.lines.map(function(l){return l.name}).join(', ')||'Just checking')+(d.schedule_notes?'. '+d.schedule_notes:''),intake:intake,signed_name:d.signed_name,_honey:$('#_honey').value};
}
function doneScreen(id){
  S.done=true; $('#nav').style.display='none'; $('#barFill').style.width='100%'; $('#metaL').innerHTML='<b>Done</b>'; $('#metaR').textContent='';
  $('#screen').innerHTML='<div class="finish"><div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><h1>Thank you'+(S.d.first_name?', '+esc(S.d.first_name):'')+'.</h1><p class="lead" style="margin-top:8px">We have what we need to get started.'+(id?' Your reference number is <b>'+esc(id)+'</b>.':'')+'</p><div class="next"><div><span class="dot cur">1</span><div><b>We call you.</b><br>During business hours we call back within 60 minutes, at the time you picked.</div></div><div><span class="dot cur">2</span><div><b>Virtual meet, then a home visit.</b><br>A short video or phone visit first, and an in-person visit within 30 days.</div></div><div><span class="dot cur">3</span><div><b>We handle the paperwork.</b><br>We contact the care manager for the service plan and authorization, or send a private-pay quote.</div></div></div><p class="hint">Need us sooner? Call <a href="tel:+17153382315"><b>715-338-2315</b></a>.</p><a class="btn ghost" href="index.html" style="margin-top:10px">Back to havencresthome.com</a></div>';
  try{ localStorage.removeItem(KEY); }catch(e){}
}
function submit(){
  var b=$('#next'); b.disabled=true; b.textContent='Sending…';
  var p=payload();
  if(PREVIEW){ setTimeout(function(){ doneScreen('PREVIEW'); },600); return; }
  fetch(HUB,{method:'POST',redirect:'follow',body:JSON.stringify(p)}).then(function(r){return r.json()}).then(function(j){ if(j&&j.ok) doneScreen(j.id); else throw new Error(j&&j.error||'send failed'); })
  .catch(function(){ b.disabled=false; b.textContent='Send to Haven Crest'; toast('Couldn’t send just now. Your answers are saved here; please try again or call 715-338-2315.'); });
}

/* ---------- resume ---------- */
$('#resumeBtn').addEventListener('click',function(){
  var em=$('#resumeEmail').value.trim(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ toast('Enter a valid email'); return; }
  var bt=this; bt.disabled=true;
  if(PREVIEW){ setTimeout(function(){ bt.disabled=false; toast('Preview: a resume link would be emailed to '+em); },500); return; }
  fetch(HUB,{method:'POST',redirect:'follow',body:JSON.stringify({action:'draft',email:em,page:location.origin+location.pathname,draft:{d:S.d,i:S.i,maxSeen:S.maxSeen}})}).then(function(r){return r.json()}).then(function(j){ bt.disabled=false; if(j&&j.ok) toast('Link sent to '+em); else throw 0; }).catch(function(){ bt.disabled=false; toast('Couldn’t send the link right now. Your answers are still saved on this device.'); });
});
function resumeFromLink(){
  var m=location.search.match(/[?&]resume=([a-f0-9]{32})/); if(!m) return;
  fetch(HUB+'?draft='+m[1],{redirect:'follow'}).then(function(r){return r.json()}).then(function(j){ if(j&&j.ok&&j.draft&&j.draft.d){ S.d=j.draft.d; S.i=j.draft.i||0; S.maxSeen=j.draft.maxSeen||0; render(); toast('Welcome back — picking up where you left off'); history.replaceState(null,'',location.pathname); } }).catch(function(){});
}
var tt; function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('on')},3200); }

/* ---------- init ---------- */
load(); savedLbl(); render(); resumeFromLink();
if(S.ts&&S.i>0) toast('Welcome back — your answers were saved');
})();
</script>
