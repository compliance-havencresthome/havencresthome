<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Haven Crest DSP Academy — Training Portal</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap">
<style>
:root{--blue:#1A6FF0;--blue-dark:#0F52C9;--navy:#0B2E6B;--sky:#5F9BF5;--tint:#EAF1FD;--ink:#0D0F14;--mute:#4D5666;--line:#E3E8F0;--bg:#F5F8FD;--ok:#1B8A4C;--warn:#B7791F;--bad:#C0392B;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,h3,h4{font-family:Poppins,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0}
a{color:var(--blue)}button{font:inherit}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.top .mark{width:36px;height:36px;border-radius:10px;background:var(--blue);display:grid;place-items:center}.top .mark svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top .brand b{display:block;font:700 15px Poppins,sans-serif;line-height:1.1}.top .brand small{font-size:11.5px;opacity:.78;letter-spacing:.02em}
.top .who{color:rgba(255,255,255,.8)}.top .who b{color:#fff}
.top .btn.ghost{color:rgba(255,255,255,.85)}.top .btn.ghost:hover{background:rgba(255,255,255,.14);color:#fff}
.tic{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;position:relative}.tic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tic i{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:#FF6B4A;border:2px solid var(--navy)}
.top .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}

.top .sp{flex:1}
.top .who{font-size:13.5px;color:var(--mute);text-align:right;line-height:1.2}
.top .who b{display:block;color:var(--ink);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--blue-dark)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:#fff;color:var(--blue);border:2px solid var(--line)}.btn.sec:hover{border-color:var(--blue);background:var(--tint)}
.btn.sm{padding:7px 14px;font-size:14px}.btn.ghost{background:transparent;color:var(--mute);border:0}.btn.ghost:hover{color:var(--blue);background:var(--tint)}
.btn.danger{background:#fff;color:var(--bad);border:2px solid #f1c9c4}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 64px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.auth{max-width:440px;margin:40px auto}
.auth h1{font-size:26px;margin-bottom:6px}.auth p{color:var(--mute);margin:0 0 18px}
label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:11px 13px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.err{background:#fdecea;color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.info{background:var(--tint);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14.5px;margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:24px}.hero p{margin:4px 0 0;color:var(--mute)}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--tint) 0);display:grid;place-items:center;flex:none}
.ring span{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 17px Poppins,sans-serif;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.home{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
.course{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.course h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:14px 16px 8px;font-family:Poppins,sans-serif}
.crow{display:flex;gap:12px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:4px solid transparent;font:inherit;color:var(--ink)}
.crow:hover{background:#f7faff}
.crow .st{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 13px Poppins,sans-serif;border:2px solid var(--line);color:var(--mute);background:#fff}
.crow .t{flex:1;min-width:0}.crow .t b{display:block;font-size:14.5px;line-height:1.25;white-space:normal}.crow .t small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.crow.done .st{background:var(--blue);border-color:var(--blue);color:#fff}
.crow.done .t b{color:var(--blue)}
.crow.cur{background:var(--tint);border-left-color:var(--blue)}
.crow.cur .st{border-color:var(--blue);color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(26,111,240,.18)}
.crow.cur .t b{color:var(--blue-dark)}
.crow.locked{opacity:.55;cursor:default}
.crow.sel{outline:2px solid var(--blue);outline-offset:-2px}
.crow.warn .st{border-color:var(--warn);color:var(--warn)}.crow.bad .st{border-color:var(--bad);color:var(--bad);background:#fdecea}
.detail{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.detail .n{font:800 12px Poppins,sans-serif;color:var(--blue);letter-spacing:.1em;text-transform:uppercase}
.detail h2{font-size:22px;line-height:1.2;margin:4px 0 8px}
.detail .meta{font-size:13.5px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.detail .secs{margin:14px 0;padding:0;list-style:none}.detail .secs li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.detail .secs li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;font-style:normal}
.detail .secs li.done i{background:var(--blue);border-color:var(--blue);color:#fff}.detail .secs li.done{color:var(--blue-dark);font-weight:700}
.detail .secs li.cur i{border-color:var(--blue)}.detail .secs li.cur{color:var(--blue-dark)}
@media (max-width:860px){.home{grid-template-columns:1fr}}
/* Classic LMS home */
.banner{position:relative;border-radius:var(--r);overflow:hidden;min-height:220px;display:flex;align-items:flex-end;padding:24px 26px;color:#fff;margin-bottom:0;background:var(--navy)}
.banner::before{content:'';position:absolute;top:0;bottom:0;right:0;width:60%;background:radial-gradient(circle at 80% 20%,rgba(26,111,240,.55),transparent 55%),radial-gradient(circle at 60% 110%,rgba(95,155,245,.35),transparent 50%)}
.banner.photo::before{background:url(/training/img/banner.jpg) center 30%/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 32%);mask-image:linear-gradient(90deg,transparent 0,#000 32%)}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,46,107,0) 55%,rgba(11,46,107,.55))}
.banner>div:first-child{max-width:60%}
.banner .eyebrow{font:700 11px Poppins,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
.banner>*{position:relative;z-index:1}
.banner h1{font-size:32px;line-height:1.05}.banner p{margin:4px 0 0;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.banner .btn.sec{background:#fff;border-color:#fff;color:var(--blue)}.banner .btn.ghost{color:#fff;border:2px solid rgba(255,255,255,.6);background:rgba(13,15,20,.15)}.banner .btn.ghost:hover{background:rgba(255,255,255,.2);color:#fff}
.mtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}.mtabs::-webkit-scrollbar{display:none}
.mtabs button{background:none;border:0;padding:14px 14px 11px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:14.5px}.mtabs button.on{color:var(--blue);border-color:var(--blue)}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.met{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.met .mi{width:34px;height:34px;border-radius:9px;background:rgba(26,111,240,.1);color:var(--blue);display:grid;place-items:center;flex:none}.met .mi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.met.warn .mi{background:#FDF3E3;color:var(--warn)}.met.bad .mi{background:#FDECEA;color:var(--bad)}.met.ok .mi{background:#E6F4EC;color:var(--ok)}
.met .ml{font-size:11.5px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;font-weight:700}.met .mv{font:800 21px/1.1 Poppins,sans-serif;margin:2px 0;font-variant-numeric:tabular-nums}.met .ms{font-size:12.5px;color:var(--mute)}
.met.warn .mv{color:var(--warn)}.met.bad .mv{color:var(--bad)}.met.ok .mv{color:var(--ok)}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;gap:4px}
.seg button{border:0;background:transparent;padding:8px 18px;border-radius:999px;font-weight:700;color:var(--mute);cursor:pointer}
.seg button.on{background:#EEF2F9;color:var(--ink)}
.search{margin-left:auto;position:relative;min-width:200px;flex:0 1 260px}.search input{padding:9px 12px 9px 36px;border-radius:8px;border-width:1.5px}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2.2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.chart{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:18px;align-items:center}
.chart h3{font-size:15px;margin-bottom:10px}
.clist{display:flex;flex-direction:column;gap:12px}
.cc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:150px 1fr 200px;gap:18px;align-items:center;transition:border-color .15s,box-shadow .15s}
.cc:hover{border-color:var(--sky);box-shadow:0 6px 20px rgba(26,111,240,.08)}
.cc.locked{opacity:.6}.cc.cont{border-left:5px solid var(--blue)}
.th{border-radius:8px;height:100px;width:100%;background:var(--tint) center/cover no-repeat;position:relative;overflow:hidden;aspect-ratio:3/2}
.th.locked::after{content:'';position:absolute;inset:0;background:rgba(77,86,102,.55)}
.th.locked svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.4;z-index:1}
.cc .t{min-width:0}.cc .t .kick{font:800 11px Poppins,sans-serif;color:var(--blue);letter-spacing:.1em;text-transform:uppercase}.cc .t h3{font-size:17px;line-height:1.25}.cc .t .meta{font-size:13px;color:var(--mute);margin-top:4px}
.cc .pr{font-size:13px;color:var(--mute)}.cc .pr b{display:block;color:var(--ink);font-weight:600;margin-bottom:6px}.cc .pr.ok b{color:var(--ok)}.cc .pr.warn b{color:var(--warn)}.cc .pr.bad b{color:var(--bad)}
.cc .pr .bar{height:5px}.cc .pr .bar.ok i{background:var(--ok)}.cc .pr .bar.warn i{background:var(--warn)}.cc .pr .bar.bad i{background:var(--bad)}
.cc .pr .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.cc .lnk{font-size:13px;color:var(--blue);background:none;border:0;cursor:pointer;font-weight:700;padding:0}
.empty{color:var(--mute);padding:30px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.heroC{display:none}
.tabbar{display:none}
.slide .hdr{height:170px;background:var(--tint) center 35%/cover no-repeat;margin:-30px -34px 22px;border-radius:var(--r) var(--r) 0 0}
@media (max-width:640px){
  .banner{display:none}
  .heroC{display:block;margin-bottom:12px;border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line)}
  .heroC .ph{height:150px;background:var(--tint) center/cover no-repeat;position:relative}
  .heroC .chip{position:absolute;left:12px;bottom:12px;background:rgba(13,15,20,.55);color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
  .heroC .chip::before{content:'▶';font-size:9px;margin-right:6px}
  .heroC .bar{border-radius:0;height:4px}.heroC .t{padding:10px 14px;display:flex;align-items:center;gap:10px}.heroC .t b{flex:1;font:800 15px Poppins,sans-serif;line-height:1.25}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin:-14px -12px 8px;padding:14px 16px 12px;background:var(--navy);color:#fff}.mhead h1{font-size:21px;line-height:1.1}.mhead small{display:block;font-size:12px;opacity:.8;font-weight:400}.mhead .btn.ghost{color:rgba(255,255,255,.9)}
  .stats{grid-template-columns:1fr}.mets{grid-template-columns:1fr 1fr}.met{padding:10px}.met .mv{font-size:18px}.chart{padding:14px;gap:12px}.donut{width:92px;height:92px}.donut span{width:64px;height:64px;font-size:16px}
  .cc{grid-template-columns:84px 1fr;gap:12px;padding:10px}.cc .th{height:58px;border-radius:8px}.cc .t h3{font-size:14px}.cc .t .meta{font-size:12px}.cc .pr{grid-column:2;margin-top:-4px}.cc .pr b{font-size:12.5px;margin-bottom:4px}
  .seg button{padding:7px 12px;font-size:14px}.search{flex:1 1 100%;margin-left:0}
  .wrap{padding-bottom:90px}
  .slide .hdr{height:100px;margin:-22px -18px 16px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute);padding:6px 0;cursor:pointer}
  .tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.on{color:var(--blue)}
  .charts{grid-template-columns:1fr}.scroll.matrix{display:none}.mlist{display:block}
}
.mhead{display:none}@media (max-width:640px){.mhead{display:flex}}
.mlist{display:none}.mrow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.mrow .t{flex:1;min-width:0}.mrow .t b{display:block}.mrow .t small{color:var(--mute)}.mrow .bar{margin:6px 0;height:5px}.mrow .bar.bad i{background:var(--bad)}.mrow .bar.warn i{background:var(--warn)}
/* orientation + uploads */
.ori{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}.ori th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:9px 10px;border-bottom:1px solid var(--line);background:#F8FAFD;white-space:nowrap}.ori td{padding:10px;border-bottom:1px solid #EEF2F7;vertical-align:middle}
.doc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--blue);font-weight:700;cursor:pointer;background:none;border:0;padding:0}.doc svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.up{border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mute);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.up input{width:auto;border:0;padding:0;font-size:13px}
.viewer{position:fixed;inset:0;background:rgba(13,15,20,.75);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}.viewer.open{display:flex}.viewer img,.viewer iframe{max-width:min(960px,100%);max-height:90vh;background:#fff;border-radius:10px}.viewer iframe{width:min(960px,100%);height:90vh}
@media (max-width:860px){.mets{grid-template-columns:1fr 1fr}}
/* admin charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:16px}
.chart{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:18px;align-items:center}
.chart h3{font-size:15px;margin-bottom:10px}
.donut{--a:0;--b:0;--c:0;--d:0;width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--blue) 0 calc(var(--a)*1%),var(--sky) calc(var(--a)*1%) calc((var(--a) + var(--b))*1%),var(--warn) calc((var(--a) + var(--b))*1%) calc((var(--a) + var(--b) + var(--c))*1%),var(--bad) calc((var(--a) + var(--b) + var(--c))*1%) calc((var(--a) + var(--b) + var(--c) + var(--d))*1%),#e6ebf3 0)}
.donut span{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 22px Poppins,sans-serif;color:var(--ink)}
.lg{font-size:13.5px;color:var(--mute);display:grid;gap:6px;flex:1}.lg div{display:flex;align-items:center;gap:8px}.lg i{width:10px;height:10px;border-radius:50%;flex:none}.lg b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.gauge{width:150px;flex:none;position:relative}.gauge svg{width:100%;height:auto;display:block}.gauge span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:800 24px Poppins,sans-serif}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;background:#dfe5ef}.dot.ok{background:var(--blue)}.dot.ip{background:#fff;border:3px solid var(--blue);box-sizing:border-box}.dot.wn{background:var(--warn)}.dot.ex{background:var(--bad)}.dot.na{background:#e4e9f1}
table.ros th.c{text-align:center;padding:8px 5px;position:sticky}table.ros td.c{text-align:center;padding:6px 5px}
.mod{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;transition:border-color .15s,box-shadow .15s}
.mod:hover{border-color:var(--sky);box-shadow:0 6px 20px rgba(26,111,240,.08)}
.mod.locked{opacity:.6}
.mod .n{font:800 12px Poppins,sans-serif;color:var(--blue);letter-spacing:.1em;text-transform:uppercase}
.mod h3{font-size:16.5px;line-height:1.25}
.mod .meta{font-size:13px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.bar{height:6px;background:var(--tint);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--blue)}
.pill.ok{background:#e6f4ec;color:var(--ok)}.pill.warn{background:#fdf3e3;color:var(--warn)}.pill.bad{background:#fdecea;color:var(--bad)}.pill.mute{background:#eef1f5;color:var(--mute)}
.mod .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
/* player */
.player{max-width:860px;margin:0 auto}
.pbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13.5px;color:var(--mute)}
.pbar .bar{flex:1}
.slide{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px 34px;min-height:380px;display:flex;flex-direction:column}
.slide .sec{font:800 12px Poppins,sans-serif;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.slide h2{font-size:26px;line-height:1.15;margin-bottom:14px}
.slide .body{font-size:16.5px;line-height:1.6}
.slide .body p{margin:0 0 12px}.slide .body ul,.slide .body ol{margin:0 0 12px;padding-left:22px}.slide .body li{margin:4px 0}
.slide .body b{font-weight:700}
.slide .body .callout{background:var(--tint);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;margin:12px 0}
.slide .body .do{background:#e6f4ec;border-left:4px solid var(--ok);border-radius:8px;padding:12px 14px;margin:12px 0}
.slide .body .dont{background:#fdecea;border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;margin:12px 0}
.slide .body .scn{background:#fff8e6;border:1px dashed #e4c77a;border-radius:10px;padding:12px 14px;margin:12px 0;font-style:italic}
.slide .body table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0 12px}.slide .body td,.slide .body th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}.slide .body th{background:var(--tint)}
.slide .body .ref{font-size:13px;color:var(--mute);margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.dots{display:flex;gap:5px;flex-wrap:wrap}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--blue)}.dots i.done{background:var(--sky)}
.q{margin:14px 0 6px}.q .qt{font-weight:700;font-size:17px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15.5px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--sky)}.opt.sel{border-color:var(--blue);background:var(--tint)}.opt.right{border-color:var(--ok);background:#e6f4ec}.opt.wrong{border-color:var(--bad);background:#fdecea}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin-top:10px;font-size:15px}.fb.ok{background:#e6f4ec;color:#145c33}.fb.bad{background:#fdecea;color:#7f2419}
.result{text-align:center;padding:20px 0}.result .big{font:800 44px Poppins,sans-serif;color:var(--blue)}
.cert{background:#fff;border:6px double var(--blue);border-radius:10px;padding:34px;text-align:center;max-width:760px;margin:0 auto}
.cert img{width:260px}.cert h2{font-size:28px;margin:14px 0 6px}.cert .nm{font:800 30px Poppins,sans-serif;margin:12px 0}.cert p{margin:6px 0;color:var(--mute)}
/* admin */
table.ros{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
table.ros th,table.ros td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:middle;white-space:nowrap}
table.ros th{position:sticky;top:0;background:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);z-index:5}
table.ros th.m{writing-mode:vertical-rl;transform:rotate(180deg);white-space:normal;max-height:150px;text-transform:none;letter-spacing:0;font-size:12px;padding:6px 4px;text-align:left}
table.ros td.m{text-align:center;padding:4px}
.st{display:inline-block;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;line-height:22px;text-align:center;cursor:default}
.st.na{background:#eef1f5;color:#9aa3b2}.st.ip{background:var(--tint);color:var(--blue)}.st.ok{background:#e6f4ec;color:var(--ok)}.st.wn{background:#fdf3e3;color:var(--warn)}.st.ex{background:#fdecea;color:var(--bad)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.kpi .v{font:800 26px Poppins,sans-serif;color:var(--blue)}.kpi .l{font-size:13px;color:var(--mute)}
.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}
.drawer{position:fixed;inset:0;background:rgba(13,15,20,.45);display:none;z-index:40}.drawer.open{display:block}
.drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:#fff;overflow:auto;padding:22px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}.toast.on{opacity:1}
.busy::after{content:'';position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--blue),var(--sky),var(--blue));background-size:200% 100%;animation:busy 1s linear infinite;z-index:50}@keyframes busy{from{background-position:0 0}to{background-position:200% 0}}
.hide{display:none!important}
@media (max-width:640px){.slide{padding:22px 18px;min-height:0}.slide h2{font-size:22px}.wrap{padding:14px 12px 60px}.top .who{display:none}}
@media print{.top,.nav,.pbar,.btn{display:none!important}body{background:#fff}.cert{border-width:4px}}

<body>
<div class="top"><div class="in">
  <a href="/" class="brand" aria-label="Haven Crest Homes"><span class="mark"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/></svg></span><span><b>Haven Crest Homes</b><small>DSP Academy &amp; Compliance Portal</small></span></a>
  <div class="sp"></div>
  <div class="who" id="who"></div>
  <button class="tic hide" id="btnBell" title="Items due" aria-label="Items due"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><i class="hide" id="bellDot"></i></button>
  <button class="btn ghost sm hide" id="btnOut">Sign out</button>
</div></div>
<div class="wrap" id="app"><div class="card auth"><h1>Loading…</h1><p>Connecting to the training portal.</p></div></div>
<div class="drawer" id="drawer"><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"></div>

<script src="/training/firebase-config.js"></script>
<script src="/training/modules/manifest.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut, updateProfile, reload, getIdToken } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, serverTimestamp, addDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $=s=>document.querySelector(s); const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)};
let pending=0; const busy=on=>{pending+=on?1:-1; document.body.classList.toggle('busy',pending>0)};
const fmtD=d=>d?new Date(d.seconds?d.seconds*1000:d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
const DAY=864e5;

const cfgOk = window.HCH_FIREBASE && !/PASTE_/.test(window.HCH_FIREBASE.projectId);
if(!cfgOk){ $('#app').innerHTML='<div class="card auth"><h1>Portal not connected yet</h1><p>The Firebase project has not been linked. An administrator needs to paste the project config into <code>/training/firebase-config.js</code>. See the setup guide.</p></div>'; throw new Error('no config'); }
const app=initializeApp(window.HCH_FIREBASE); const auth=getAuth(app); const db=getFirestore(app);
const ADMINS=(window.HCH_ADMIN_EMAILS||[]).map(e=>e.toLowerCase());
const MODS=(window.HCH_MODULES||[]).slice().sort((a,b)=>a.order-b.order);

const S={user:null,profile:null,progress:{},creds:[],view:'home',tab:'dsp',play:null};

/* ---------- auth screens ---------- */
function authView(mode){
  const reg=mode==='register';
  $('#app').innerHTML=`<div class="card auth">
    <h1>${reg?'Create your training account':'Sign in to the DSP Academy'}</h1>
    <p>${reg?'Register, verify your email, and an administrator will approve your access.':'Haven Crest Homes staff training. Use the email you registered with.'}</p>
    ${reg?`<label>Full name</label><input id="aName" autocomplete="name" placeholder="First and last name">
    <label>Mobile phone</label><input id="aPhone" autocomplete="tel" placeholder="(715) 555-0100">
    <label>I am training as</label><select id="aRole"><option value="dsp">Direct Support Professional (DSP)</option><option value="admin">Office / Administrative staff</option></select>`:''}
    <label>Email</label><input id="aEmail" type="email" autocomplete="email" placeholder="you@example.com">
    <label>Password</label><input id="aPass" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="${reg?'At least 8 characters':'Your password'}">
    <div id="aErr"></div>
    <div class="row" style="margin-top:18px"><button class="btn" id="aGo">${reg?'Create account':'Sign in'}</button>
    <button class="btn ghost" id="aSwap">${reg?'I already have an account':'New here? Register'}</button></div>
    ${reg?'':'<div style="margin-top:14px;font-size:14px"><a href="#" id="aForgot">Forgot your password?</a></div>'}
    <div class="info" style="margin-top:22px">Questions? <a href="mailto:compliance@havencresthome.com">compliance@havencresthome.com</a> · 715-338-2315</div>
  </div>`;
  $('#aSwap').onclick=()=>authView(reg?'login':'register');
  const err=m=>{$('#aErr').innerHTML=m?`<div class="err">${esc(m)}</div>`:''};
  const nice=e=>({'auth/invalid-email':'That email address is not valid.','auth/user-not-found':'No account with that email. Register first.','auth/wrong-password':'Wrong password.','auth/invalid-credential':'Email or password is incorrect.','auth/email-already-in-use':'An account already exists for that email. Sign in instead.','auth/weak-password':'Use at least 8 characters.','auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.'}[e.code]||e.message);
  $('#aGo').onclick=async()=>{
    err(''); const email=$('#aEmail').value.trim(), pass=$('#aPass').value;
    if(!email||!pass) return err('Enter your email and password.');
    busy(true); $('#aGo').disabled=true;
    try{
      if(reg){
        const name=$('#aName').value.trim(), phone=$('#aPhone').value.trim(), role=$('#aRole').value;
        if(name.length<2) throw new Error('Enter your full name.');
        if(pass.length<8) throw {code:'auth/weak-password'};
        const cred=await createUserWithEmailAndPassword(auth,email,pass);
        await updateProfile(cred.user,{displayName:name});
        const isBoot=ADMINS.includes(email.toLowerCase());
        await setDoc(doc(db,'users',cred.user.uid),{name,email,phone,role,access:isBoot?'admin':'pending',createdAt:serverTimestamp()});
        await sendEmailVerification(cred.user,{url:location.origin+'/training/'});
      } else {
        await signInWithEmailAndPassword(auth,email,pass);
      }
    }catch(e){ err(nice(e)); }
    busy(false); const b=$('#aGo'); if(b) b.disabled=false;
  };
  const f=$('#aForgot'); if(f) f.onclick=async ev=>{ev.preventDefault(); const email=$('#aEmail').value.trim(); if(!email) return err('Enter your email above first, then click Forgot.'); try{ await sendPasswordResetEmail(auth,email,{url:location.origin+'/training/'}); toast('Password reset email sent'); }catch(e){ err(nice(e)); } };
  $('#aPass').onkeydown=e=>{ if(e.key==='Enter') $('#aGo').click(); };
}

function verifyView(){
  $('#app').innerHTML=`<div class="card auth"><h1>Verify your email</h1><p>We sent a verification link to <b>${esc(S.user.email)}</b>. Open it, then come back here.</p>
  <div class="row"><button class="btn" id="vCheck">I've verified — continue</button><button class="btn sec" id="vResend">Resend email</button></div><div id="vErr"></div></div>`;
  $('#vCheck').onclick=async()=>{ await reload(S.user); if(S.user.emailVerified){ sessionStorage.removeItem('hch_tok'); boot(S.user); } else $('#vErr').innerHTML='<div class="err">Not verified yet. Check your inbox (and spam folder).</div>'; };
  $('#vResend').onclick=async()=>{ try{ await sendEmailVerification(S.user,{url:location.origin+'/training/'}); toast('Sent'); }catch(e){ toast(e.message); } };
}
function pendingView(){
  $('#app').innerHTML=`<div class="card auth"><h1>Thanks, ${esc(S.profile.name.split(' ')[0])} — you're registered</h1>
  <p>An administrator reviews new accounts before training opens. You'll get an email once approved (usually within one business day).</p>
  <div class="info">Need it sooner? Call 715-338-2315 or email <a href="mailto:compliance@havencresthome.com">compliance@havencresthome.com</a>.</div>
  <div class="row" style="margin-top:18px"><button class="btn sec" id="pRefresh">Check again</button></div></div>`;
  $('#pRefresh').onclick=()=>boot(S.user);
}

/* ---------- data ---------- */
const isAdmin=()=>S.profile&&(S.profile.access==='admin'||ADMINS.includes((S.user.email||'').toLowerCase()));
async function loadProgress(uid){ const snap=await getDocs(collection(db,'progress',uid,'modules')); const o={}; snap.forEach(d=>o[d.id]=d.data()); return o; }
async function loadCreds(uid){ const snap=await getDocs(collection(db,'creds',uid,'items')); const a=[]; snap.forEach(d=>a.push({id:d.id,...d.data()})); return a; }
function modStatus(p,m){
  if(!p) return {k:'na',label:'Not started',pct:0};
  if(p.completedAt){ const exp=p.expiresAt?(p.expiresAt.seconds?p.expiresAt.seconds*1000:p.expiresAt):null; const dl=exp?Math.ceil((exp-Date.now())/DAY):null;
    if(dl!==null&&dl<0) return {k:'ex',label:'Expired',pct:100,days:dl,score:p.score};
    if(dl!==null&&dl<=30) return {k:'wn',label:'Renew in '+dl+' d',pct:100,days:dl,score:p.score};
    return {k:'ok',label:'Complete · '+p.score+'%',pct:100,days:dl,score:p.score}; }
  const total=m.sections.reduce((n,s)=>n+s.slides.length,0); let done=0; for(let i=0;i<(p.section||0);i++) done+=m.sections[i].slides.length; done+=(p.slide||0);
  return {k:'ip',label:'In progress',pct:Math.round(100*done/total)};
}
/* ---------- Requirements register (crosswalk Nov 2026) ---------- */
const CRED_TYPES=[
 {key:'bid',label:'Background Information Disclosure (BID) at hire',renew:null,req:true,ref:'DHS 12'},
 {key:'bgc',label:'Caregiver background check (DHS 12)',renew:4*365,req:true,ref:'DHS 12; Wis. Stat. 50.065 — at hire and every 4 years'},
 {key:'i9',label:'I-9 / W-4 / job description on file',renew:null,req:true,ref:'Personnel file'},
 {key:'tb',label:'TB / communicable disease screen',renew:365,req:false,ref:'Best practice; required if personal-care certified (DHS 105.17)'},
 {key:'cpr',label:'CPR / First Aid',renew:2*365,req:false,ref:'Best practice; required only if a contract adds it'},
 {key:'dl',label:"Driver's license & auto insurance",renew:365,req:'driver',ref:'Lakeland SHC §5; MCW orientation — only if transporting members'},
 {key:'abstract',label:'Wisconsin driving-record abstract',renew:365,req:'driver',ref:'My Choice WI — annually, if transporting'},
 {key:'moc',label:'MCW Model of Care attestation',renew:365,req:'mcw',ref:'My Choice WI — before serving Partnership/SNP members, annually'},
 {key:'excl',label:'Exclusion list check (OIG LEIE / SAM)',renew:30,req:true,ref:'42 CFR 455 — at hire and monthly'},
 {key:'lic',label:'CNA / other license',renew:null,req:false,ref:'Reviewed at expiry'},
 {key:'other',label:'Other',renew:null,req:false,ref:''}];
const AGENCY=[
 {id:'coi',label:'Certificates of insurance sent to every contracted MCO (GL, professional, workers comp)',renew:365,ref:'Community Care Handbook §8 (within 30 days of renewal); MCW additional insured'},
 {id:'policies',label:'Policies & procedures manual reviewed (supervision, backup, complaints, incidents, conflict of interest, restrictive measures, FWA)',renew:365,ref:'Inclusa/iCare §4.5; Lakeland §9'},
 {id:'drill',label:'Emergency / disaster plan drill',renew:365,ref:'Agency emergency plan'},
 {id:'excl',label:'Monthly exclusion list check (OIG LEIE / SAM) for all staff',renew:30,ref:'42 CFR 455'},
 {id:'enroll',label:'ForwardHealth / Medicaid enrollment & revalidation current; MCO credentialing current',renew:365,ref:'Anthem §3 (re-credential every 3 years)'},
 {id:'evv',label:'EVV exception log reviewed and corrections documented',renew:30,ref:'ForwardHealth EVV; Community Care §11'},
 {id:'retention',label:'Records retention policy = 10 years; audit binder index updated',renew:365,ref:'Community Care §8; Anthem §2'},
 {id:'bgc',label:'Background check recheck schedule reviewed (every 4 years per caregiver)',renew:365,ref:'DHS 12'}];
const SKILLS=['Hand hygiene and PPE','Bathing / showering and skin observation','Toileting and incontinence care','Dressing and grooming','Feeding and hydration support','Safe transfers (stand-pivot, gait belt)','Mechanical lift (if used)','Fall response and reporting','EVV clock-in / clock-out','Visit note and incident report'];
const POLICIES=['Confidentiality / HIPAA agreement','Code of conduct and professional boundaries','Client rights and complaint procedure','Abuse, neglect and misconduct reporting (DHS 13)','No restrictive measures policy','Fraud, waste and abuse policy','Attendance, backup and call-off policy'];
function reqList(user,progress,creds,checks){
  const role=user.role||'dsp', isDriver=!!user.driver, mcw=!!user.mcw; const mods=MODS.filter(m=>m.roles.includes(role)); const out=[];
  const credOf=k=>{ const t=CRED_TYPES.find(x=>x.key===k); const c=creds.filter(x=>x.label===t.label||x.key===k).sort((a,b)=>tsMs(b.issuedAt)-tsMs(a.issuedAt))[0]; return {t,c}; };
  const credSt=(t,c)=>{ if(!c) return {k:'na',label:'Not on file'}; const exp=c.expiresAt?tsMs(c.expiresAt):(t.renew?tsMs(c.issuedAt)+t.renew*DAY:null); if(!exp) return {k:'ok',label:'On file · '+fmtD(c.issuedAt)}; const dl=Math.ceil((exp-Date.now())/DAY); return dl<0?{k:'ex',label:'Expired '+fmtD(exp),days:dl}:dl<=30?{k:'wn',label:'Renew by '+fmtD(exp),days:dl}:{k:'ok',label:'Current · to '+fmtD(exp),days:dl}; };
  // A. Paperwork and checks
  CRED_TYPES.filter(t=>t.key!=='other'&&t.key!=='lic').forEach(t=>{ const applies=t.req===true||(t.req==='driver'&&isDriver)||(t.req==='mcw'&&mcw)||t.req===false; if(!applies) return; const {c}=credOf(t.key); out.push({group:'Checks & paperwork',id:'cred:'+t.key,label:t.label,ref:t.ref,required:t.req!==false,st:credSt(t,c),kind:'cred'}); });
  // B. Policies acknowledged (self-signed in portal)
  POLICIES.forEach((pl,i)=>{ const c=checks.find(x=>x.type==='policy'&&x.key==='p'+i); const dl=c?Math.ceil((tsMs(c.signedAt)+365*DAY-Date.now())/DAY):null; out.push({group:'Policies acknowledged',id:'policy:p'+i,label:pl,ref:'Annual acknowledgment',required:true,kind:'policy',key:'p'+i,st:!c?{k:'na',label:'Not signed'}:dl<0?{k:'ex',label:'Re-sign (annual)'}:{k:'ok',label:'Signed '+fmtD(c.signedAt)}}); });
  // C. Training modules with due rules
  const hire=user.hireDate?tsMs(user.hireDate):tsMs(user.createdAt); const since=Math.floor((Date.now()-hire)/DAY);
  mods.forEach(m=>{ const st=modStatus(progress[m.id],m); let note=''; let k=st.k; if(k==='na'||k==='ip'){ if(m.beforePersonalCare) note='Required before first personal-assistance visit'; else if(m.dueDays) { note='Due within '+m.dueDays+' days of hire'+(since>m.dueDays?' — overdue':''); if(since>m.dueDays) k='ex'; } else { note='Due within 6 months of hire'+(since>182?' — overdue':''); if(since>182) k='ex'; } }
    out.push({group:'Training',id:'mod:'+m.id,label:'Module '+m.order+' · '+m.title,ref:note||(m.refs||[])[0]||'',required:true,kind:'module',mid:m.id,st:{k,label:st.label+(note&&(k==='na'||k==='ip')?' · '+note:''),days:st.days}}); });
  // D. Supervisor sign-offs
  SKILLS.forEach((sk,i)=>{ const c=checks.find(x=>x.type==='skill'&&x.key==='s'+i); const dl=c?Math.ceil((tsMs(c.signedAt)+365*DAY-Date.now())/DAY):null; out.push({group:'Hands-on skills (supervisor signed)',id:'skill:s'+i,label:sk,ref:'DHS P-01602 §V.4–5 — demonstrated competency, annual',required:role==='dsp',kind:'skill',key:'s'+i,st:!c?{k:'na',label:'Not yet demonstrated'}:dl<0?{k:'ex',label:'Re-check due (annual)'}:{k:'ok',label:'Signed '+fmtD(c.signedAt)+' by '+(c.signedBy||'')}}); });
  const ori=checks.filter(x=>x.type==='orientation'); out.push({group:'Member-specific orientation',id:'orient',label:ori.length?ori.length+' member orientation(s) on file':'Member-specific orientation before first solo visit',ref:'P-01602 §V.4; DHS 105.17(1n)(a)2.b; Inclusa/iCare §5.7',required:role==='dsp',kind:'orientation',st:ori.length?{k:'ok',label:ori.map(o=>o.member+' · '+fmtD(o.signedAt)).join('; ')}:{k:'na',label:'None recorded — required before the first solo visit with each member'}});
  const ev=checks.filter(x=>x.type==='eval').sort((a,b)=>tsMs(b.signedAt)-tsMs(a.signedAt))[0]; const evd=ev?Math.ceil((tsMs(ev.signedAt)+365*DAY-Date.now())/DAY):null;
  out.push({group:'Supervision',id:'eval',label:'Annual performance evaluation',ref:'Inclusa/iCare §6.2; Lakeland §6',required:true,kind:'eval',st:!ev?{k:since>365?'ex':'na',label:since>365?'Overdue':'Due within first year'}:evd<0?{k:'ex',label:'Overdue — last '+fmtD(ev.signedAt)}:{k:'ok',label:'Done '+fmtD(ev.signedAt)}});
  const sup=checks.filter(x=>x.type==='supervision').sort((a,b)=>tsMs(b.signedAt)-tsMs(a.signedAt))[0]; const supd=sup?Math.ceil((Date.now()-tsMs(sup.signedAt))/DAY):null;
  out.push({group:'Supervision',id:'sup',label:'Supervisory contact (monthly) / home observation (quarterly)',ref:'On-site supervision and review — written supervision policy',required:role==='dsp',kind:'supervision',st:!sup?{k:'na',label:'No contact logged'}:supd>31?{k:'wn',label:'Last contact '+fmtD(sup.signedAt)+' — overdue'}:{k:'ok',label:'Last contact '+fmtD(sup.signedAt)+(sup.kind==='observation'?' (home observation)':'')}});
  return out;
}
function clearance(items){ const req=items.filter(i=>i.required); const bad=req.filter(i=>['ex','na'].includes(i.st.k)&&!(i.kind==='module'&&i.st.k==='na'&&!/overdue|before first/i.test(i.st.label))); const soon=req.filter(i=>i.st.k==='wn'); return {ok:bad.length===0,bad,soon}; }

/* ---------- documents (stored in Firestore, compressed) ---------- */
async function fileToDataUrl(file){ if(file.type==='application/pdf'){ if(file.size>950000) throw new Error('PDF is larger than 950 KB. Export it smaller or photograph the page.'); return await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Could not read the image')); i.src=URL.createObjectURL(file); });
  let w=img.width,h=img.height; const max=1600; if(w>max||h>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
  const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); let q=.85, out=c.toDataURL('image/jpeg',q); while(out.length>900000&&q>.4){ q-=.1; out=c.toDataURL('image/jpeg',q); } if(out.length>900000) throw new Error('Image is too detailed to store; try a smaller photo.'); return out; }
async function uploadDoc(uid,key,file,list,after){ if(!file) return; busy(true); try{ const data=await fileToDataUrl(file); const rec={type:'doc',key,name:file.name,mime:file.type==='application/pdf'?'application/pdf':'image/jpeg',data,uploadedBy:S.profile.name,signedAt:serverTimestamp()}; const ref=await addDoc(collection(db,'checks',uid,'items'),rec); list.push({id:ref.id,...rec,signedAt:new Date()}); toast('Document saved'); }catch(e){ toast(e.message); } busy(false); if(after) after(); }
function viewDoc(d){ if(!d) return; let v=$('#viewer'); if(!v){ v=document.createElement('div'); v.id='viewer'; v.className='viewer'; v.onclick=()=>v.classList.remove('open'); document.body.appendChild(v); } v.innerHTML=d.mime==='application/pdf'?`<iframe src="${d.data}" title="${esc(d.name||'Document')}"></iframe>`:`<img src="${d.data}" alt="${esc(d.name||'Document')}">`; v.classList.add('open'); }

async function saveProg(patch){ const id=S.play.m.id; const cur=S.progress[id]||{}; const next={...cur,...patch,updatedAt:serverTimestamp()}; S.progress[id]={...cur,...patch,updatedAt:new Date()}; try{ await setDoc(doc(db,'progress',S.user.uid,'modules',id),next,{merge:true}); }catch(e){ toast('Could not save progress: '+e.message); } }
function renderSlide(){

  <div class="nav"><button class="btn sec" id="pPrev" ${idx===0?'disabled':''}>Back</button><div class="dots">${S_.slides.map((_,i)=>`<i class="${i<sl?'done':i===sl?'on':''}"></i>`).join('')}</div><button class="btn" id="pNext">${last?(S_.check&&S_.check.length?'Knowledge check →':(sec===m.sections.length-1?'Final quiz →':'Next section →')):'Next'}</button></div></div>`;

    if(S_.check&&S_.check.length&&!S.play.checks[sec]) return renderCheck();

}
function advanceSection(){ const {m,sec}=S.play; if(sec<m.sections.length-1){ S.play.sec=sec+1; S.play.sl=0; if(!S.play.review) saveProg({section:S.play.sec,slide:0,checks:S.play.checks}); renderSlide(); } else renderQuiz(); }
function renderCheck(){

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderQuiz(){

    $('#app').innerHTML=`<div class="player"><div class="pbar"><button class="btn ghost sm" id="pBack">← All modules</button><span>${esc(m.title)} · Final quiz</span><div class="bar"><i style="width:${Math.round(100*i/qs.length)}%"></i></div><span>${i+1}/${qs.length}</span></div>

    ${!passed&&missed.length?`<div style="text-align:left;margin:16px auto;max-width:560px"><b>Review these topics:</b><ul>${missed.map(q=>`<li>${esc(q.q)}</li>`).join('')}</ul></div>`:''}

    const h=$('#rHome'); if(h) h.onclick=homeView; const c=$('#rCert'); if(c) c.onclick=()=>certView(m);
    const rt=$('#rRetake'); if(rt) rt.onclick=renderQuiz; const rv=$('#rReview'); if(rv) rv.onclick=()=>{ S.play.sec=0; S.play.sl=0; S.play.review=true; renderSlide(); };

  <td>${(()=>{const cl=clearance(reqList(u,u.progress,u.creds,u.checks||[])); return cl.ok?'<span class="pill ok">Cleared</span>':'<span class="pill bad" title="'+esc(cl.bad.map(b=>b.label).join('; '))+'">Not cleared · '+cl.bad.length+'</span>';})()}</td><td><button class="btn ghost sm" data-edit="${u.id}">Manage</button></td></tr>`).join('')}</tbody></table></div>
  <div class="card" style="margin-top:16px"><h3 style="font-size:16px;margin-bottom:8px">Agency compliance checklist</h3><table class="ros" style="font-size:13.5px">${AGENCY.map(a=>{const r=S.agency[a.id]||{}; const dl=r.doneAt?Math.ceil((tsMs(r.doneAt)+a.renew*DAY-Date.now())/DAY):null; return `<tr><td style="white-space:normal"><b>${esc(a.label)}</b><br><span style="color:var(--mute);font-size:12px">${esc(a.ref)}</span></td><td><span class="pill ${dl===null?'mute':dl<0?'bad':dl<=30?'warn':'ok'}">${dl===null?'Not recorded':dl<0?'Overdue · last '+fmtD(r.doneAt):'Done '+fmtD(r.doneAt)+' · next by '+fmtD(tsMs(r.doneAt)+a.renew*DAY)}</span></td><td><button class="btn sm sec" data-agency="${a.id}">Mark done today</button></td></tr>`}).join('')}</table></div>
  <p style="font-size:12.5px;color:var(--mute);margin-top:10px">Hover a dot for the module name and status. <i class="dot ok" style="vertical-align:middle"></i> complete · <i class="dot ip" style="vertical-align:middle"></i> in progress · <i class="dot wn" style="vertical-align:middle"></i> due within 30 days · <i class="dot ex" style="vertical-align:middle"></i> expired · <i class="dot na" style="vertical-align:middle"></i> not started. Reminder emails go to compliance@havencresthome.com daily when anything is due within 30/14/7 days or expired.</p>`;
  $('#aBack').onclick=homeView; $('#aReload').onclick=adminView;
  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{ busy(true); await updateDoc(doc(db,'users',b.dataset.approve),{access:'active',approvedAt:serverTimestamp(),approvedBy:S.user.email}); busy(false); toast('Approved'); const u=us.find(x=>x.id===b.dataset.approve); u.access='active'; drawAdmin(); });
  document.querySelectorAll('[data-deny]').forEach(b=>b.onclick=async()=>{ const u=us.find(x=>x.id===b.dataset.deny); if(!confirm('Remove '+u.name+'\'s registration? They can register again later.')) return; busy(true); await updateDoc(doc(db,'users',u.id),{access:'disabled'}); busy(false); u.access='disabled'; drawAdmin(); });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>manageUser(us.find(x=>x.id===b.dataset.edit)));
  document.querySelectorAll('[data-agency]').forEach(b=>b.onclick=async()=>{ busy(true); try{ await setDoc(doc(db,'agency',b.dataset.agency),{doneAt:serverTimestamp(),by:S.user.email},{merge:true}); S.agency[b.dataset.agency]={doneAt:new Date(),by:S.user.email}; }catch(e){ toast(e.message); } busy(false); drawAdmin(); });
  $('#aCsv').onclick=()=>{ const head=['Name','Email','Phone','Track','Access',...MODS.map(m=>m.title+' status'),...MODS.map(m=>m.title+' completed'),...MODS.map(m=>m.title+' expires'),'Credentials']; const lines=[head]; us.forEach(u=>{ lines.push([u.name,u.email,u.phone||'',u.role,u.access,...MODS.map(m=>modStatus(u.progress[m.id],m).label),...MODS.map(m=>{const p=u.progress[m.id];return p&&p.completedAt?fmtD(p.completedAt):''}),...MODS.map(m=>{const p=u.progress[m.id];return p&&p.expiresAt?fmtD(p.expiresAt):''}),u.creds.map(c=>c.label+' exp '+fmtD(c.expiresAt)).join('; ')]); }); const csv=lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='haven-crest-training-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); };
}
function manageUser(u){
  const d=$('#drawer'); d.classList.add('open');
  const draw=()=>{ $('#pane').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="font-size:20px">${esc(u.name)}</h2><button class="btn ghost sm" id="dClose">Close</button></div>
  <p style="color:var(--mute);margin:4px 0 14px">${esc(u.email)} · ${esc(u.phone||'no phone')} · registered ${fmtD(u.createdAt)}</p>
  <label>Training track</label><select id="uRole"><option value="dsp" ${u.role!=='admin'?'selected':''}>DSP</option><option value="admin" ${u.role==='admin'?'selected':''}>Office / Admin</option></select>
  <label>Portal access</label><select id="uAccess"><option value="active" ${u.access==='active'?'selected':''}>Active staff</option><option value="admin" ${u.access==='admin'?'selected':''}>Administrator</option><option value="pending" ${u.access==='pending'?'selected':''}>Pending</option><option value="disabled" ${u.access==='disabled'?'selected':''}>Disabled</option></select>
  <div class="row"><div style="flex:1"><label>Hire date</label><input type="date" id="uHire" value="${u.hireDate?new Date(tsMs(u.hireDate)).toISOString().slice(0,10):''}"></div><div style="flex:1"><label>Flags</label><label style="font-weight:400;display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="uDriver" ${u.driver?'checked':''} style="width:auto"> Transports members</label><label style="font-weight:400;display:flex;gap:8px;align-items:center;margin:4px 0 0"><input type="checkbox" id="uMcw" ${u.mcw?'checked':''} style="width:auto"> Serves My Choice WI Partnership/SNP members</label></div></div>
  <div class="row" style="margin-top:12px"><button class="btn sm" id="uSave">Save</button></div>
  ${(()=>{const cl=clearance(reqList(u,u.progress,u.creds,u.checks||[])); return `<div class="card" style="margin-top:14px;padding:12px;border-left:5px solid ${cl.ok?'var(--ok)':'var(--bad)'}"><b>${cl.ok?'Cleared to work':'Not cleared to work'}</b><div style="font-size:13px;color:var(--mute)">${cl.ok?'All required items current.':cl.bad.map(b=>b.label).join(' · ')}</div></div>`})()}
  <h3 style="font-size:15px;margin:22px 0 8px">Documents <span style="font-weight:400;color:var(--mute);font-size:12.5px">(cards, receipts, results — stored with the record)</span></h3>
  ${(u.checks||[]).filter(x=>x.type==='doc').map(d=>`<div class="row" style="padding:5px 0;border-top:1px solid var(--line)"><div style="flex:1;font-size:13.5px"><button class="doc" data-viewdoc="${d.id}"><svg viewBox="0 0 24 24"><path d="M14 3v4h4M6 3h8l6 6v12H6z"/></svg>${esc(d.name||'Document')}</button><br><span style="font-size:12px;color:var(--mute)">${esc((CRED_TYPES.find(t=>'cred:'+t.key===d.key)||{}).label||d.key)} · ${fmtD(d.signedAt)} · ${esc(d.uploadedBy||'')}</span></div><button class="btn ghost sm" data-delchk="${d.id}">Remove</button></div>`).join('')||'<div style="color:var(--mute);font-size:13.5px">No documents yet.</div>'}
  <div class="up" style="margin-top:8px"><select id="dType" style="width:auto;padding:6px 8px">${CRED_TYPES.filter(t=>t.key!=='other').map(t=>`<option value="cred:${t.key}">${esc(t.label)}</option>`).join('')}</select><input type="file" id="dFile" accept="image/*,.pdf"><span>Photo or PDF, up to ~1 MB (photos are compressed automatically)</span></div>
  <h3 style="font-size:15px;margin:22px 0 8px">Hands-on skills check-off <span style="font-weight:400;color:var(--mute);font-size:12.5px">(supervisor signs; annual)</span></h3>
  ${SKILLS.map((sk,i)=>{const c=(u.checks||[]).find(x=>x.type==='skill'&&x.key==='s'+i); return `<div class="row" style="padding:5px 0;border-top:1px solid var(--line)"><div style="flex:1;font-size:14px">${esc(sk)}${c?`<br><span style="font-size:12px;color:var(--mute)">signed ${fmtD(c.signedAt)} by ${esc(c.signedBy||'')}</span>`:''}</div><button class="btn sm ${c?'sec':''}" data-skill="${i}">${c?'Re-sign today':'Sign off'}</button></div>`}).join('')}
  <h3 style="font-size:15px;margin:22px 0 8px">Member-specific orientation</h3>
  ${(u.checks||[]).filter(x=>x.type==='orientation').map(o=>`<div class="row" style="padding:5px 0;border-top:1px solid var(--line)"><div style="flex:1;font-size:14px"><b>${esc(o.member)}</b> · ${fmtD(o.signedAt)} · ${esc(o.signedBy||'')}${o.note?' · '+esc(o.note):''}</div><button class="btn ghost sm" data-delchk="${o.id}">Remove</button></div>`).join('')}
  <div class="row" style="margin-top:6px"><div style="flex:1"><label>Member (initials or ID)</label><input id="oMember" placeholder="e.g. J.D. / L261125"></div><div style="flex:2"><label>What was covered</label><input id="oNote" placeholder="Service Plan, routines, transfer method, emergency info, shadow visit"></div><button class="btn sm" id="oAdd" style="align-self:flex-end">Record</button></div>
  <h3 style="font-size:15px;margin:22px 0 8px">Supervision log</h3>
  ${(u.checks||[]).filter(x=>['supervision','eval'].includes(x.type)).sort((a,b)=>tsMs(b.signedAt)-tsMs(a.signedAt)).slice(0,6).map(o=>`<div style="padding:4px 0;border-top:1px solid var(--line);font-size:13.5px">${fmtD(o.signedAt)} · <b>${o.type==='eval'?'Annual evaluation':o.kind==='observation'?'Home observation':'Supervisory contact'}</b> · ${esc(o.signedBy||'')}${o.note?' · '+esc(o.note):''}</div>`).join('')||'<div style="color:var(--mute);font-size:13.5px">Nothing logged yet.</div>'}
  <div class="row" style="margin-top:6px"><select id="sKind" style="flex:1"><option value="contact">Supervisory contact</option><option value="observation">Home observation</option><option value="eval">Annual evaluation</option></select><input id="sNote" placeholder="Note" style="flex:2"><button class="btn sm" id="sAdd">Log today</button></div>
  <h3 style="font-size:15px;margin:22px 0 8px">Modules</h3>
  <table class="ros">${MODS.map(m=>{const s=modStatus(u.progress[m.id],m); const p=u.progress[m.id]||{}; return `<tr><td style="white-space:normal">${esc(m.title)}</td><td><span class="pill ${s.k==='ok'?'ok':s.k==='wn'?'warn':s.k==='ex'?'bad':s.k==='ip'?'':'mute'}">${esc(s.label)}</span></td><td style="font-size:12px;color:var(--mute)">${p.completedAt?'done '+fmtD(p.completedAt)+' · exp '+fmtD(p.expiresAt)+' · '+(p.attempts||1)+' attempt(s)':''}</td><td>${p.completedAt||p.section?`<button class="btn ghost sm" data-reset="${m.id}">Reset</button>`:''}</td></tr>`}).join('')}</table>
  <h3 style="font-size:15px;margin:22px 0 8px">Credentials (CPR/First Aid, background check, TB screen…)</h3>
  ${u.creds.map(c=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><div style="flex:1"><b>${esc(c.label)}</b><br><span style="font-size:12.5px;color:var(--mute)">issued ${fmtD(c.issuedAt)} · expires ${fmtD(c.expiresAt)}${c.note?' · '+esc(c.note):''}</span></div><button class="btn ghost sm" data-delc="${c.id}">Remove</button></div>`).join('')}
  <div class="card" style="margin-top:10px;padding:14px"><label>Credential</label><select id="cType">${CRED_TYPES.map(t=>`<option value="${t.key}">${esc(t.label)}</option>`).join('')}</select>
  <div class="row"><div style="flex:1"><label>Issued</label><input type="date" id="cIss"></div><div style="flex:1"><label>Expires</label><input type="date" id="cExp"></div></div><label>Note</label><input id="cNote" placeholder="Provider, certificate #, etc."><div class="row" style="margin-top:10px"><button class="btn sm" id="cAdd">Add credential</button></div></div>`;
    $('#dClose').onclick=()=>d.classList.remove('open');
    $('#uSave').onclick=async()=>{ busy(true); const role=$('#uRole').value, access=$('#uAccess').value, hire=$('#uHire').value, driver=$('#uDriver').checked, mcw=$('#uMcw').checked; const patch={role,access,driver,mcw,updatedAt:serverTimestamp()}; if(hire) patch.hireDate=new Date(hire+'T12:00:00'); await updateDoc(doc(db,'users',u.id),patch); Object.assign(u,{role,access,driver,mcw}); if(hire) u.hireDate=new Date(hire+'T12:00:00'); busy(false); toast('Saved'); draw(); drawAdmin(); };
    const addChk=async(data)=>{ busy(true); try{ const ref=await addDoc(collection(db,'checks',u.id,'items'),{...data,signedBy:S.profile.name,signedAt:serverTimestamp()}); u.checks=u.checks||[]; u.checks.push({id:ref.id,...data,signedBy:S.profile.name,signedAt:new Date()}); toast('Recorded'); }catch(e){ toast('Could not save: '+e.message); } busy(false); draw(); drawAdmin(); };
    document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.skill; if(confirm('Confirm '+u.name+' demonstrated: '+SKILLS[i]+'?')) addChk({type:'skill',key:'s'+i,label:SKILLS[i]}); });
    $('#oAdd').onclick=()=>{ const member=$('#oMember').value.trim(); if(!member) return toast('Enter the member'); addChk({type:'orientation',member,note:$('#oNote').value.trim()}); };
    $('#sAdd').onclick=()=>{ const k=$('#sKind').value; addChk(k==='eval'?{type:'eval',note:$('#sNote').value.trim()}:{type:'supervision',kind:k,note:$('#sNote').value.trim()}); };
    $('#dFile').onchange=()=>uploadDoc(u.id,$('#dType').value,$('#dFile').files[0],u.checks=u.checks||[],()=>{draw();drawAdmin();});
    document.querySelectorAll('[data-viewdoc]').forEach(b=>b.onclick=()=>viewDoc((u.checks||[]).find(c=>c.id===b.dataset.viewdoc)));
    document.querySelectorAll('[data-delchk]').forEach(b=>b.onclick=async()=>{ busy(true); await deleteDoc(doc(db,'checks',u.id,'items',b.dataset.delchk)); u.checks=u.checks.filter(c=>c.id!==b.dataset.delchk); busy(false); draw(); drawAdmin(); });
    document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{ if(!confirm('Reset this module for '+u.name+'? They will need to retake it.')) return; busy(true); await deleteDoc(doc(db,'progress',u.id,'modules',b.dataset.reset)); delete u.progress[b.dataset.reset]; busy(false); draw(); drawAdmin(); });
    document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=async()=>{ busy(true); await deleteDoc(doc(db,'creds',u.id,'items',b.dataset.delc)); u.creds=u.creds.filter(c=>c.id!==b.dataset.delc); busy(false); draw(); drawAdmin(); });
    $('#cAdd').onclick=async()=>{ const key=$('#cType').value, label=CRED_TYPES.find(t=>t.key===key).label, iss=$('#cIss').value, exp=$('#cExp').value, note=$('#cNote').value; if(!iss) return toast('Enter the issued date'); busy(true); const ref=await addDoc(collection(db,'creds',u.id,'items'),{key,label,issuedAt:new Date(iss),expiresAt:exp?new Date(exp):null,note,addedBy:S.user.email,addedAt:serverTimestamp()}); u.creds.push({id:ref.id,key,label,issuedAt:new Date(iss),expiresAt:exp?new Date(exp):null,note}); busy(false); toast('Added'); draw(); drawAdmin(); };
  }; draw();
}

/* ---------- boot ---------- */
async function boot(user){
  S.user=user; busy(true);
  try{
    if(!user.emailVerified){ busy(false); $('#who').innerHTML=`<b>${esc(user.displayName||user.email)}</b>unverified`; $('#btnOut').classList.remove('hide'); return verifyView(); }
    // Security rules read email_verified from the ID token; refresh it once per session so a just-verified account is not denied.
    if(!sessionStorage.getItem('hch_tok')){ try{ await getIdToken(user,true); sessionStorage.setItem('hch_tok','1'); }catch(_){} }
    const ps=await getDoc(doc(db,'users',user.uid));
    if(!ps.exists()){ const isBoot=ADMINS.includes((user.email||'').toLowerCase()); await setDoc(doc(db,'users',user.uid),{name:user.displayName||user.email,email:user.email,phone:'',role:'dsp',access:isBoot?'admin':'pending',createdAt:serverTimestamp()}); S.profile=(await getDoc(doc(db,'users',user.uid))).data(); } else S.profile=ps.data();
    $('#who').innerHTML=`<b>${esc(S.profile.name)}</b>${esc(S.profile.role==='admin'?'Office / Admin':'DSP')}${isAdmin()?' · admin':''}`; $('#btnOut').classList.remove('hide');
    if(S.profile.access==='pending'||S.profile.access==='disabled'){ busy(false); return pendingView(); }
    S.progress=await loadProgress(user.uid); S.creds=await loadCreds(user.uid); S.checks=await loadChecks(user.uid);
    busy(false);
    const m=(location.hash.match(/#m=(\w+)/)||[])[1]; if(m&&MODS.find(x=>x.id===m)) openModule(m); else if(location.hash==='#admin'&&isAdmin()) adminView(); else homeView();
  }catch(e){ busy(false); $('#app').innerHTML=`<div class="card auth"><h1>Something went wrong</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Reload</button></div>`; }
}
$('#btnOut').onclick=()=>{ sessionStorage.removeItem('hch_tok'); signOut(auth); };
onAuthStateChanged(auth,u=>{ if(u) boot(u); else { S.user=null; S.profile=null; $('#who').innerHTML=''; $('#btnOut').classList.add('hide'); authView(location.hash==='#register'?'register':'login'); } });
</script>
