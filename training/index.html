<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Haven Crest DSP Academy — Training Portal</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap">
<style>
:root{--blue:#1A6FF0;--blue-dark:#0F52C9;--sky:#5F9BF5;--tint:#EAF1FD;--ink:#0D0F14;--mute:#4D5666;--line:#D9E2F0;--bg:#F5F8FD;--ok:#1B8A4C;--warn:#B7791F;--bad:#C0392B;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,h3,h4{font-family:Poppins,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0}
a{color:var(--blue)}button{font:inherit}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.top img{height:34px;width:auto;display:block}
.top .sp{flex:1}
.top .who{font-size:13.5px;color:var(--mute);text-align:right;line-height:1.2}
.top .who b{display:block;color:var(--ink);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--blue-dark)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:#fff;color:var(--blue);border:2px solid var(--line)}.btn.sec:hover{border-color:var(--blue);background:var(--tint)}
.btn.sm{padding:7px 14px;font-size:14px}.btn.ghost{background:transparent;color:var(--mute);border:0}.btn.ghost:hover{color:var(--blue);background:var(--tint)}
.btn.danger{background:#fff;color:var(--bad);border:2px solid #f1c9c4}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 64px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.auth{max-width:440px;margin:40px auto}
.auth h1{font-size:26px;margin-bottom:6px}.auth p{color:var(--mute);margin:0 0 18px}
label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:11px 13px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.err{background:#fdecea;color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.info{background:var(--tint);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14.5px;margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:24px}.hero p{margin:4px 0 0;color:var(--mute)}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--tint) 0);display:grid;place-items:center;flex:none}
.ring span{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 17px Poppins,sans-serif;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.home{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
.course{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.course h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:14px 16px 8px;font-family:Poppins,sans-serif}
.crow{display:flex;gap:12px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:4px solid transparent;font:inherit;color:var(--ink)}
.crow:hover{background:#f7faff}
.crow .st{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 13px Poppins,sans-serif;border:2px solid var(--line);color:var(--mute);background:#fff}
.crow .t{flex:1;min-width:0}.crow .t b{display:block;font-size:14.5px;line-height:1.25;white-space:normal}.crow .t small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.crow.done .st{background:var(--blue);border-color:var(--blue);color:#fff}
.crow.done .t b{color:var(--blue)}
.crow.cur{background:var(--tint);border-left-color:var(--blue)}
.crow.cur .st{border-color:var(--blue);color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(26,111,240,.18)}
.crow.cur .t b{color:var(--blue-dark)}
.crow.locked{opacity:.55;cursor:default}
.crow.sel{outline:2px solid var(--blue);outline-offset:-2px}
.crow.warn .st{border-color:var(--warn);color:var(--warn)}.crow.bad .st{border-color:var(--bad);color:var(--bad);background:#fdecea}
.detail{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.detail .n{font:800 12px Poppins,sans-serif;color:var(--blue);letter-spacing:.1em;text-transform:uppercase}
.detail h2{font-size:22px;line-height:1.2;margin:4px 0 8px}
.detail .meta{font-size:13.5px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.detail .secs{margin:14px 0;padding:0;list-style:none}.detail .secs li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.detail .secs li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;font-style:normal}
.detail .secs li.done i{background:var(--blue);border-color:var(--blue);color:#fff}.detail .secs li.done{color:var(--blue-dark);font-weight:700}
.detail .secs li.cur i{border-color:var(--blue)}.detail .secs li.cur{color:var(--blue-dark)}
@media (max-width:860px){.home{grid-template-columns:1fr}}
.mod{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;transition:border-color .15s,box-shadow .15s}
.mod:hover{border-color:var(--sky);box-shadow:0 6px 20px rgba(26,111,240,.08)}
.mod.locked{opacity:.6}
.mod .n{font:800 12px Poppins,sans-serif;color:var(--blue);letter-spacing:.1em;text-transform:uppercase}
.mod h3{font-size:16.5px;line-height:1.25}
.mod .meta{font-size:13px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.bar{height:6px;background:var(--tint);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--blue)}
.pill.ok{background:#e6f4ec;color:var(--ok)}.pill.warn{background:#fdf3e3;color:var(--warn)}.pill.bad{background:#fdecea;color:var(--bad)}.pill.mute{background:#eef1f5;color:var(--mute)}
.mod .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
/* player */
.player{max-width:860px;margin:0 auto}
.pbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13.5px;color:var(--mute)}
.pbar .bar{flex:1}
.slide{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px 34px;min-height:380px;display:flex;flex-direction:column}
.slide .sec{font:800 12px Poppins,sans-serif;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.slide h2{font-size:26px;line-height:1.15;margin-bottom:14px}
.slide .body{font-size:16.5px;line-height:1.6}
.slide .body p{margin:0 0 12px}.slide .body ul,.slide .body ol{margin:0 0 12px;padding-left:22px}.slide .body li{margin:4px 0}
.slide .body b{font-weight:700}
.slide .body .callout{background:var(--tint);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;margin:12px 0}
.slide .body .do{background:#e6f4ec;border-left:4px solid var(--ok);border-radius:8px;padding:12px 14px;margin:12px 0}
.slide .body .dont{background:#fdecea;border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;margin:12px 0}
.slide .body .scn{background:#fff8e6;border:1px dashed #e4c77a;border-radius:10px;padding:12px 14px;margin:12px 0;font-style:italic}
.slide .body table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0 12px}.slide .body td,.slide .body th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}.slide .body th{background:var(--tint)}
.slide .body .ref{font-size:13px;color:var(--mute);margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.dots{display:flex;gap:5px;flex-wrap:wrap}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--blue)}.dots i.done{background:var(--sky)}
.q{margin:14px 0 6px}.q .qt{font-weight:700;font-size:17px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15.5px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--sky)}.opt.sel{border-color:var(--blue);background:var(--tint)}.opt.right{border-color:var(--ok);background:#e6f4ec}.opt.wrong{border-color:var(--bad);background:#fdecea}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin-top:10px;font-size:15px}.fb.ok{background:#e6f4ec;color:#145c33}.fb.bad{background:#fdecea;color:#7f2419}
.result{text-align:center;padding:20px 0}.result .big{font:800 44px Poppins,sans-serif;color:var(--blue)}
.cert{background:#fff;border:6px double var(--blue);border-radius:10px;padding:34px;text-align:center;max-width:760px;margin:0 auto}
.cert img{width:260px}.cert h2{font-size:28px;margin:14px 0 6px}.cert .nm{font:800 30px Poppins,sans-serif;margin:12px 0}.cert p{margin:6px 0;color:var(--mute)}
/* admin */
table.ros{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
table.ros th,table.ros td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:middle;white-space:nowrap}
table.ros th{position:sticky;top:56px;background:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);z-index:5}
table.ros th.m{writing-mode:vertical-rl;transform:rotate(180deg);white-space:normal;max-height:150px;text-transform:none;letter-spacing:0;font-size:12px;padding:6px 4px;text-align:left}
table.ros td.m{text-align:center;padding:4px}
.st{display:inline-block;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;line-height:22px;text-align:center;cursor:default}
.st.na{background:#eef1f5;color:#9aa3b2}.st.ip{background:var(--tint);color:var(--blue)}.st.ok{background:#e6f4ec;color:var(--ok)}.st.wn{background:#fdf3e3;color:var(--warn)}.st.ex{background:#fdecea;color:var(--bad)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.kpi .v{font:800 26px Poppins,sans-serif;color:var(--blue)}.kpi .l{font-size:13px;color:var(--mute)}
.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}
.drawer{position:fixed;inset:0;background:rgba(13,15,20,.45);display:none;z-index:40}.drawer.open{display:block}
.drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:#fff;overflow:auto;padding:22px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}.toast.on{opacity:1}
.busy::after{content:'';position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--blue),var(--sky),var(--blue));background-size:200% 100%;animation:busy 1s linear infinite;z-index:50}@keyframes busy{from{background-position:0 0}to{background-position:200% 0}}
.hide{display:none!important}
@media (max-width:640px){.slide{padding:22px 18px;min-height:0}.slide h2{font-size:22px}.wrap{padding:14px 12px 60px}.top .who{display:none}}
@media print{.top,.nav,.pbar,.btn{display:none!important}body{background:#fff}.cert{border-width:4px}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a href="/"><img src="/logo.png" alt="Haven Crest Homes"></a>
  <div style="font:800 14px Poppins,sans-serif;color:var(--blue);letter-spacing:.06em;text-transform:uppercase">DSP Academy</div>
  <div class="sp"></div>
  <div class="who" id="who"></div>
  <button class="btn ghost sm hide" id="btnOut">Sign out</button>
</div></div>
<div class="wrap" id="app"><div class="card auth"><h1>Loading…</h1><p>Connecting to the training portal.</p></div></div>
<div class="drawer" id="drawer"><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"></div>

<script src="/training/firebase-config.js"></script>
<script src="/training/modules/manifest.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut, updateProfile, reload, getIdToken } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, serverTimestamp, addDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $=s=>document.querySelector(s); const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)};
let pending=0; const busy=on=>{pending+=on?1:-1; document.body.classList.toggle('busy',pending>0)};
const fmtD=d=>d?new Date(d.seconds?d.seconds*1000:d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
const DAY=864e5;

const cfgOk = window.HCH_FIREBASE && !/PASTE_/.test(window.HCH_FIREBASE.projectId);
if(!cfgOk){ $('#app').innerHTML='<div class="card auth"><h1>Portal not connected yet</h1><p>The Firebase project has not been linked. An administrator needs to paste the project config into <code>/training/firebase-config.js</code>. See the setup guide.</p></div>'; throw new Error('no config'); }
const app=initializeApp(window.HCH_FIREBASE); const auth=getAuth(app); const db=getFirestore(app);
const ADMINS=(window.HCH_ADMIN_EMAILS||[]).map(e=>e.toLowerCase());
const MODS=(window.HCH_MODULES||[]).slice().sort((a,b)=>a.order-b.order);

const S={user:null,profile:null,progress:{},creds:[],view:'home',tab:'dsp',play:null};

/* ---------- auth screens ---------- */
function authView(mode){
  const reg=mode==='register';
  $('#app').innerHTML=`<div class="card auth">
    <h1>${reg?'Create your training account':'Sign in to the DSP Academy'}</h1>
    <p>${reg?'Register, verify your email, and an administrator will approve your access.':'Haven Crest Homes staff training. Use the email you registered with.'}</p>
    ${reg?`<label>Full name</label><input id="aName" autocomplete="name" placeholder="First and last name">
    <label>Mobile phone</label><input id="aPhone" autocomplete="tel" placeholder="(715) 555-0100">
    <label>I am training as</label><select id="aRole"><option value="dsp">Direct Support Professional (DSP)</option><option value="admin">Office / Administrative staff</option></select>`:''}
    <label>Email</label><input id="aEmail" type="email" autocomplete="email" placeholder="you@example.com">
    <label>Password</label><input id="aPass" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="${reg?'At least 8 characters':'Your password'}">
    <div id="aErr"></div>
    <div class="row" style="margin-top:18px"><button class="btn" id="aGo">${reg?'Create account':'Sign in'}</button>
    <button class="btn ghost" id="aSwap">${reg?'I already have an account':'New here? Register'}</button></div>
    ${reg?'':'<div style="margin-top:14px;font-size:14px"><a href="#" id="aForgot">Forgot your password?</a></div>'}
    <div class="info" style="margin-top:22px">Questions? <a href="mailto:compliance@havencresthome.com">compliance@havencresthome.com</a> · 715-338-2315</div>
  </div>`;
  $('#aSwap').onclick=()=>authView(reg?'login':'register');
  const err=m=>{$('#aErr').innerHTML=m?`<div class="err">${esc(m)}</div>`:''};
  const nice=e=>({'auth/invalid-email':'That email address is not valid.','auth/user-not-found':'No account with that email. Register first.','auth/wrong-password':'Wrong password.','auth/invalid-credential':'Email or password is incorrect.','auth/email-already-in-use':'An account already exists for that email. Sign in instead.','auth/weak-password':'Use at least 8 characters.','auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.'}[e.code]||e.message);
  $('#aGo').onclick=async()=>{
    err(''); const email=$('#aEmail').value.trim(), pass=$('#aPass').value;
    if(!email||!pass) return err('Enter your email and password.');
    busy(true); $('#aGo').disabled=true;
    try{
      if(reg){
        const name=$('#aName').value.trim(), phone=$('#aPhone').value.trim(), role=$('#aRole').value;
        if(name.length<2) throw new Error('Enter your full name.');
        if(pass.length<8) throw {code:'auth/weak-password'};
        const cred=await createUserWithEmailAndPassword(auth,email,pass);
        await updateProfile(cred.user,{displayName:name});
        const isBoot=ADMINS.includes(email.toLowerCase());
        await setDoc(doc(db,'users',cred.user.uid),{name,email,phone,role,access:isBoot?'admin':'pending',createdAt:serverTimestamp()});
        await sendEmailVerification(cred.user,{url:location.origin+'/training/'});
      } else {
        await signInWithEmailAndPassword(auth,email,pass);
      }
    }catch(e){ err(nice(e)); }
    busy(false); const b=$('#aGo'); if(b) b.disabled=false;
  };
  const f=$('#aForgot'); if(f) f.onclick=async ev=>{ev.preventDefault(); const email=$('#aEmail').value.trim(); if(!email) return err('Enter your email above first, then click Forgot.'); try{ await sendPasswordResetEmail(auth,email,{url:location.origin+'/training/'}); toast('Password reset email sent'); }catch(e){ err(nice(e)); } };
  $('#aPass').onkeydown=e=>{ if(e.key==='Enter') $('#aGo').click(); };
}

function verifyView(){
  $('#app').innerHTML=`<div class="card auth"><h1>Verify your email</h1><p>We sent a verification link to <b>${esc(S.user.email)}</b>. Open it, then come back here.</p>
  <div class="row"><button class="btn" id="vCheck">I've verified — continue</button><button class="btn sec" id="vResend">Resend email</button></div><div id="vErr"></div></div>`;
  $('#vCheck').onclick=async()=>{ await reload(S.user); if(S.user.emailVerified){ sessionStorage.removeItem('hch_tok'); boot(S.user); } else $('#vErr').innerHTML='<div class="err">Not verified yet. Check your inbox (and spam folder).</div>'; };
  $('#vResend').onclick=async()=>{ try{ await sendEmailVerification(S.user,{url:location.origin+'/training/'}); toast('Sent'); }catch(e){ toast(e.message); } };
}
function pendingView(){
  $('#app').innerHTML=`<div class="card auth"><h1>Thanks, ${esc(S.profile.name.split(' ')[0])} — you're registered</h1>
  <p>An administrator reviews new accounts before training opens. You'll get an email once approved (usually within one business day).</p>
  <div class="info">Need it sooner? Call 715-338-2315 or email <a href="mailto:compliance@havencresthome.com">compliance@havencresthome.com</a>.</div>
  <div class="row" style="margin-top:18px"><button class="btn sec" id="pRefresh">Check again</button></div></div>`;
  $('#pRefresh').onclick=()=>boot(S.user);
}

/* ---------- data ---------- */
const isAdmin=()=>S.profile&&(S.profile.access==='admin'||ADMINS.includes((S.user.email||'').toLowerCase()));
async function loadProgress(uid){ const snap=await getDocs(collection(db,'progress',uid,'modules')); const o={}; snap.forEach(d=>o[d.id]=d.data()); return o; }
async function loadCreds(uid){ const snap=await getDocs(collection(db,'creds',uid,'items')); const a=[]; snap.forEach(d=>a.push({id:d.id,...d.data()})); return a; }
function modStatus(p,m){
  if(!p) return {k:'na',label:'Not started',pct:0};
  if(p.completedAt){ const exp=p.expiresAt?(p.expiresAt.seconds?p.expiresAt.seconds*1000:p.expiresAt):null; const dl=exp?Math.ceil((exp-Date.now())/DAY):null;
    if(dl!==null&&dl<0) return {k:'ex',label:'Expired',pct:100,days:dl,score:p.score};
    if(dl!==null&&dl<=30) return {k:'wn',label:'Renew in '+dl+' d',pct:100,days:dl,score:p.score};
    return {k:'ok',label:'Complete · '+p.score+'%',pct:100,days:dl,score:p.score}; }
  const total=m.sections.reduce((n,s)=>n+s.slides.length,0); let done=0; for(let i=0;i<(p.section||0);i++) done+=m.sections[i].slides.length; done+=(p.slide||0);
  return {k:'ip',label:'In progress',pct:Math.round(100*done/total)};
}
function tsMs(v){ return v?(v.seconds?v.seconds*1000:+new Date(v)):0; }
function trackMods(){ const r=S.profile.role||'dsp'; return MODS.filter(m=>m.roles.includes(r)); }

/* ---------- home ---------- */
function homeView(){
  S.view='home'; const mods=trackMods(); const done=mods.filter(m=>['ok','wn'].includes(modStatus(S.progress[m.id],m).k)).length; const pct=Math.round(100*done/mods.length);

  const curIdx=(()=>{ let k=info.findIndex(x=>x.st.k==='ip'); if(k<0) k=info.findIndex(x=>x.st.k==='ex'); if(k<0) k=info.findIndex(x=>x.st.k==='na'&&!x.locked); if(k<0) k=info.findIndex(x=>x.st.k==='wn'); return k; })();
  let selIdx=(()=>{ const h=(location.hash.match(/#sel=(\w+)/)||[])[1]; const k=info.findIndex(x=>x.m.id===h); return k>=0?k:(curIdx>=0?curIdx:0); })();
  const rowCls=x=>[completed(x.m)?'done':'', x.i===curIdx?'cur':'', x.locked?'locked':'', x.st.k==='wn'?'warn':x.st.k==='ex'?'bad':''].filter(Boolean).join(' ');
  const rowSt=x=>completed(x.m)&&x.st.k==='ok'?'✓':x.st.k==='ex'?'!':String(x.i+1);
  const rowSub=x=>x.locked?'Complete the previous module first':x.st.k==='ok'?'Complete · '+x.st.score+'%':x.st.k==='wn'?'Due for renewal · '+x.st.days+' days':x.st.k==='ex'?'Expired — renew now':x.st.k==='ip'?'In progress · '+x.st.pct+'%':x.m.minutes+' min · '+x.m.sections.length+' sections';
  $('#mods').innerHTML=info.map(x=>`<button class="crow ${rowCls(x)} ${x.i===selIdx?'sel':''}" data-sel="${x.i}"><span class="st">${rowSt(x)}</span><span class="t"><b>${esc(x.m.title)}</b><small>${esc(rowSub(x))}</small></span></button>`).join('');
  const drawDetail=()=>{ const x=info[selIdx]; const m=x.m, st=x.st, p=S.progress[m.id]||{}; const canOpen=!x.locked;

      <div class="row" style="gap:8px;align-items:center"><span class="pill ${st.k==='ok'?'ok':st.k==='wn'?'warn':st.k==='ex'?'bad':st.k==='ip'?'':'mute'}">${x.locked?'Locked':esc(st.label)}</span>${p.completedAt?`<span style="font-size:13px;color:var(--mute)">Completed ${fmtD(p.completedAt)} · valid until ${fmtD(p.expiresAt)}</span>`:''}</div>
      <div class="bar" style="margin:12px 0"><i style="width:${st.pct}%"></i></div>
      <ul class="secs">${m.sections.map((sx,i)=>`<li class="${secDone(i)?'done':secCur(i)?'cur':''}"><i>${secDone(i)?'✓':''}</i><span>Section ${i+1} · ${esc(sx.title)}</span></li>`).join('')}<li class="${completed(m)?'done':''}"><i>${completed(m)?'✓':''}</i><span>Final quiz</span></li></ul>
      <div class="row" style="gap:8px">${canOpen?`<button class="btn ${st.k==='ok'?'sec':''}" data-open="${m.id}">${st.k==='na'?'Start module':st.k==='ip'?'Continue where you left off':st.k==='ex'||st.k==='wn'?'Renew — retake module':'Review module'}</button>`:`<span style="color:var(--mute);font-size:14px">Finish Module ${x.i} to unlock this one.</span>`}${completed(m)?`<button class="btn sec" data-cert="${m.id}">Certificate</button>`:''}</div>`;
    document.querySelectorAll('#detail [data-open]').forEach(b=>b.onclick=()=>openModule(b.dataset.open));
    document.querySelectorAll('#detail [data-cert]').forEach(b=>b.onclick=()=>certView(MODS.find(y=>y.id===b.dataset.cert)));

  document.querySelectorAll('[data-cert]').forEach(b=>b.onclick=()=>certView(MODS.find(x=>x.id===b.dataset.cert)));
  const certs=mods.filter(completed); $('#certList').innerHTML=certs.length?'<table class="ros"><tr><th>Certificate</th><th>Completed</th><th>Score</th><th>Valid until</th><th></th></tr>'+(pct===100?`<tr><td><b>Core curriculum — all modules</b></td><td>${fmtD(Math.max(...certs.map(x=>tsMs(S.progress[x.id].completedAt))))}</td><td>—</td><td>${fmtD(Math.min(...certs.map(x=>tsMs(S.progress[x.id].expiresAt))))}</td><td><button class="btn sm" data-certall="1">View / save</button></td></tr>`:'')+certs.map(x=>{const p=S.progress[x.id]; const dl=Math.ceil((tsMs(p.expiresAt)-Date.now())/DAY); return `<tr><td>${esc(x.title)}</td><td>${fmtD(p.completedAt)}</td><td>${p.score}%</td><td>${fmtD(p.expiresAt)} ${dl<0?'<span class="pill bad">Expired</span>':dl<=30?'<span class="pill warn">'+dl+' days</span>':''}</td><td><button class="btn sm sec" data-cert="${x.id}">View / save</button></td></tr>`}).join('')+'</table>':'<span style="color:var(--mute)">Certificates appear here as you complete modules. Each one stays on your portal and can be printed or saved as a PDF any time.</span>';
  document.querySelectorAll('[data-cert]').forEach(b=>b.onclick=()=>certView(MODS.find(x=>x.id===b.dataset.cert)));
  const ca=$('[data-certall]'); if(ca) ca.onclick=()=>certView();
  const hc=$('#hCert'); if(hc) hc.onclick=()=>certView();
  const ha=$('#hAdmin'); if(ha) ha.onclick=()=>adminView();
  $('#hRole').onclick=async()=>{ const r=S.profile.role==='admin'?'dsp':'admin'; if(!confirm('Switch your training track to '+(r==='admin'?'Office / Admin':'DSP')+'? Your progress is kept.')) return; await updateDoc(doc(db,'users',S.user.uid),{role:r,updatedAt:serverTimestamp()}); S.profile.role=r; homeView(); };
  $('#credList').innerHTML=S.creds.length?'<table class="ros"><tr><th>Credential</th><th>Issued</th><th>Expires</th><th>Status</th></tr>'+S.creds.map(c=>{const dl=c.expiresAt?Math.ceil(((c.expiresAt.seconds?c.expiresAt.seconds*1000:c.expiresAt)-Date.now())/DAY):null; return `<tr><td>${esc(c.label)}</td><td>${fmtD(c.issuedAt)}</td><td>${fmtD(c.expiresAt)}</td><td>${dl===null?'<span class="pill mute">No expiry</span>':dl<0?'<span class="pill bad">Expired</span>':dl<=30?'<span class="pill warn">'+dl+' days</span>':'<span class="pill ok">Current</span>'}</td></tr>`}).join('')+'</table>':'<span style="color:var(--mute)">None recorded yet. Your administrator records CPR/First Aid, background check and health screening dates here.</span>';
}

/* ---------- player ---------- */
async function openModule(id){
  const m=MODS.find(x=>x.id===id); const p=S.progress[id]||{section:0,slide:0,checks:{},attempts:0};
  S.play={m,sec:p.completedAt?0:(p.section||0),sl:p.completedAt?0:(p.slide||0),checks:p.completedAt?{}:(p.checks||{}),attempts:p.attempts||0,review:!!p.completedAt,stage:'slides'};
  S.view='play'; history.replaceState(null,'','#m='+id); renderSlide();
}
async function saveProg(patch){ const id=S.play.m.id; const cur=S.progress[id]||{}; const next={...cur,...patch,updatedAt:serverTimestamp()}; S.progress[id]={...cur,...patch,updatedAt:new Date()}; try{ await setDoc(doc(db,'progress',S.user.uid,'modules',id),next,{merge:true}); }catch(e){ toast('Could not save progress: '+e.message); } }
function renderSlide(){
  const {m,sec,sl}=S.play; const S_=m.sections[sec]; const slide=S_.slides[sl]; const total=m.sections.reduce((n,s)=>n+s.slides.length,0); let idx=0; for(let i=0;i<sec;i++) idx+=m.sections[i].slides.length; idx+=sl;
  const last=sl===S_.slides.length-1;
  $('#app').innerHTML=`<div class="player"><div class="pbar"><button class="btn ghost sm" id="pBack">← All modules</button><span>${esc(m.title)}</span><div class="bar"><i style="width:${Math.round(100*(idx)/total)}%"></i></div><span>${idx+1}/${total}</span></div>
  <div class="slide"><div class="sec">Section ${sec+1} of ${m.sections.length} · ${esc(S_.title)}</div><h2>${esc(slide.h)}</h2><div class="body">${slide.body}${slide.ref?`<div class="ref">Source: ${esc(slide.ref)}</div>`:''}</div></div>
  <div class="nav"><button class="btn sec" id="pPrev" ${idx===0?'disabled':''}>Back</button><div class="dots">${S_.slides.map((_,i)=>`<i class="${i<sl?'done':i===sl?'on':''}"></i>`).join('')}</div><button class="btn" id="pNext">${last?(S_.check&&S_.check.length?'Knowledge check →':(sec===m.sections.length-1?'Final quiz →':'Next section →')):'Next'}</button></div></div>`;
  window.scrollTo({top:0});
  $('#pBack').onclick=()=>{ history.replaceState(null,'','#'); homeView(); };
  $('#pPrev').onclick=()=>{ if(sl>0) S.play.sl--; else { S.play.sec--; S.play.sl=m.sections[S.play.sec].slides.length-1; } renderSlide(); };
  $('#pNext').onclick=()=>{ if(!last){ S.play.sl++; if(!S.play.review) saveProg({section:S.play.sec,slide:S.play.sl}); renderSlide(); return; }
    if(S_.check&&S_.check.length&&!S.play.checks[sec]) return renderCheck();
    advanceSection(); };
}
function advanceSection(){ const {m,sec}=S.play; if(sec<m.sections.length-1){ S.play.sec=sec+1; S.play.sl=0; if(!S.play.review) saveProg({section:S.play.sec,slide:0,checks:S.play.checks}); renderSlide(); } else renderQuiz(); }
function renderCheck(){
  const {m,sec}=S.play; const qs=m.sections[sec].check; let i=0; const answers=[];
  const draw=()=>{ const q=qs[i];
    $('#app').innerHTML=`<div class="player"><div class="pbar"><button class="btn ghost sm" id="pBack">← All modules</button><span>${esc(m.title)} · Knowledge check</span></div>
    <div class="slide"><div class="sec">Section ${sec+1} · Check ${i+1} of ${qs.length}</div><div class="q"><div class="qt">${esc(q.q)}</div>${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}<div id="fb"></div></div>
    <div class="nav" style="margin-top:auto"><span></span><button class="btn hide" id="cNext">Continue</button></div></div></div>`;
    $('#pBack').onclick=()=>homeView();
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; document.querySelectorAll('.opt').forEach(x=>x.disabled=true); if(k===q.a){ b.classList.add('right'); $('#fb').innerHTML=`<div class="fb ok"><b>Correct.</b> ${esc(q.why||'')}</div>`; $('#cNext').classList.remove('hide'); answers[i]=true; } else { b.classList.add('wrong'); $('#fb').innerHTML=`<div class="fb bad"><b>Not quite.</b> ${esc(q.why||'Review the section and try again.')}<br><br><button class="btn sm" id="cRetry">Try again</button></div>`; $('#cRetry').onclick=draw; } });
    $('#cNext').onclick=()=>{ i++; if(i<qs.length) draw(); else { S.play.checks[sec]=true; if(!S.play.review) saveProg({checks:S.play.checks}); advanceSection(); } };
    window.scrollTo({top:0});
  }; draw();
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderQuiz(){
  const {m}=S.play; const qs=shuffle(m.quiz).map(q=>{ const order=shuffle(q.options.map((_,i)=>i)); return {q:q.q,options:order.map(i=>q.options[i]),a:order.indexOf(q.a),why:q.why}; });
  let i=0, correct=0; const missed=[];
  const draw=()=>{ const q=qs[i];
    $('#app').innerHTML=`<div class="player"><div class="pbar"><button class="btn ghost sm" id="pBack">← All modules</button><span>${esc(m.title)} · Final quiz</span><div class="bar"><i style="width:${Math.round(100*i/qs.length)}%"></i></div><span>${i+1}/${qs.length}</span></div>
    <div class="slide"><div class="sec">Final quiz · pass mark ${m.pass||80}%</div><div class="q"><div class="qt">${esc(q.q)}</div>${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>
    <div class="nav" style="margin-top:auto"><span style="font-size:13px;color:var(--mute)">Pick the best answer. You'll see results at the end.</span><button class="btn" id="qNext" disabled>${i===qs.length-1?'Submit':'Next'}</button></div></div></div>`;
    $('#pBack').onclick=()=>{ if(confirm('Leave the quiz? Your answers so far will not be saved.')) homeView(); };
    let pick=null; document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); pick=+b.dataset.k; $('#qNext').disabled=false; });
    $('#qNext').onclick=()=>{ $('#qNext').disabled=true; document.querySelectorAll('.opt').forEach(x=>x.disabled=true); if(pick===q.a) correct++; else missed.push(q); i++; if(i<qs.length) draw(); else finish(); };
    window.scrollTo({top:0});
  };
  const finish=async()=>{ const score=Math.round(100*correct/qs.length); const passed=score>=(m.pass||80); S.play.attempts++;
    if(passed){ const now=Date.now(); const exp=new Date(now+(m.renewDays||365)*DAY); { await saveProg({completedAt:new Date(now),expiresAt:exp,score,attempts:S.play.attempts,section:m.sections.length-1,slide:m.sections[m.sections.length-1].slides.length-1,history:[...((S.progress[m.id]||{}).history||[]),{at:new Date(now),score}]}); } try{ await addDoc(collection(db,'audit'),{uid:S.user.uid,email:S.user.email,name:S.profile.name,module:m.id,score,at:serverTimestamp()}); }catch(_){} }
    else await saveProg({attempts:S.play.attempts,lastFailScore:score,lastFailAt:new Date()});
    $('#app').innerHTML=`<div class="player"><div class="slide"><div class="result"><div class="big">${score}%</div><h2 style="font-size:24px">${passed?'Passed — module complete':'Not passed yet'}</h2>
    <p style="color:var(--mute)">${correct} of ${qs.length} correct. ${passed?`This module is valid until <b>${fmtD(new Date(Date.now()+(m.renewDays||365)*DAY))}</b>.`:`You need ${m.pass||80}% to pass. Review the areas below, then retake the quiz.`}</p>
    ${!passed&&missed.length?`<div style="text-align:left;margin:16px auto;max-width:560px"><b>Review these topics:</b><ul>${missed.map(q=>`<li>${esc(q.q)}</li>`).join('')}</ul></div>`:''}
    <div class="row" style="justify-content:center;margin-top:16px">${passed?`<button class="btn" id="rHome">Back to modules</button><button class="btn sec" id="rCert">Module certificate</button>`:`<button class="btn" id="rRetake">Retake quiz</button><button class="btn sec" id="rReview">Review module</button>`}</div></div></div></div>`;
    const h=$('#rHome'); if(h) h.onclick=homeView; const c=$('#rCert'); if(c) c.onclick=()=>certView(m);
    const rt=$('#rRetake'); if(rt) rt.onclick=renderQuiz; const rv=$('#rReview'); if(rv) rv.onclick=()=>{ S.play.sec=0; S.play.sl=0; S.play.review=true; renderSlide(); };
  };
  draw();
}
function certView(m){
  const mods=trackMods(); const all=!m; const when=all?Math.max(...mods.map(x=>{const p=S.progress[x.id];return p&&p.completedAt?(p.completedAt.seconds?p.completedAt.seconds*1000:+new Date(p.completedAt)):0})):(S.progress[m.id].completedAt.seconds?S.progress[m.id].completedAt.seconds*1000:+new Date(S.progress[m.id].completedAt));
  $('#app').innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn ghost sm" id="cBack">← Back</button><button class="btn sm" onclick="print()">Save as PDF / print</button><span style="font-size:13px;color:var(--mute);align-self:center">Choose "Save as PDF" in the print dialog. This certificate stays on your portal.</span></div>
  <div class="cert"><img src="/logo.png" alt="Haven Crest Homes"><h2>Certificate of Completion</h2><p>This certifies that</p><div class="nm">${esc(S.profile.name)}</div>
  <p>has successfully completed${all?' the Haven Crest DSP Academy core curriculum':''}</p><p style="font:700 18px Poppins,sans-serif;color:var(--ink)">${all?mods.map(x=>esc(x.title)).join(' · '):esc(m.title)}</p>
  <p>with a passing score of ${all?'80% or higher on every module':S.progress[m.id].score+'%'} · ${fmtD(when)}</p>
  <p style="margin-top:16px;font-size:13px">Aligned to Wisconsin DHS P-01602 (MCO Training and Documentation Standards for Supportive Home Care), DHS 105.17(1n), and DHS 12/13.<br>Haven Crest Homes LLC · 1507 Tower Ave, Suite 333, Superior, WI 54880 · Verification: ${esc(S.user.uid.slice(0,8).toUpperCase())}</p></div>`;
  $('#cBack').onclick=homeView;
}

/* ---------- admin ---------- */
async function adminView(){
  S.view='admin'; busy(true);
  const us=[]; (await getDocs(collection(db,'users'))).forEach(d=>us.push({id:d.id,...d.data()}));
  for(const u of us){ u.progress=await loadProgress(u.id); u.creds=await loadCreds(u.id); }
  busy(false); S.admin={users:us.sort((a,b)=>(a.name||'').localeCompare(b.name||''))};
  drawAdmin();
}
function drawAdmin(){
  const us=S.admin.users; const pend=us.filter(u=>u.access==='pending'); const act=us.filter(u=>u.access!=='pending'&&u.access!=='disabled');
  let expired=0,soon=0,complete=0; const rows=[];
  act.forEach(u=>{ const mods=MODS.filter(m=>m.roles.includes(u.role||'dsp')); const sts=mods.map(m=>modStatus(u.progress[m.id],m)); const done=sts.filter(s=>['ok','wn'].includes(s.k)).length; if(done===mods.length) complete++; expired+=sts.filter(s=>s.k==='ex').length; soon+=sts.filter(s=>s.k==='wn').length;
    u.creds.forEach(c=>{ if(c.expiresAt){ const dl=Math.ceil(((c.expiresAt.seconds?c.expiresAt.seconds*1000:c.expiresAt)-Date.now())/DAY); if(dl<0) expired++; else if(dl<=30) soon++; } }); rows.push({u,mods,sts,done}); });
  $('#app').innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn ghost sm" id="aBack">← My training</button><h1 style="font-size:22px">Training administration</h1><div style="flex:1"></div><button class="btn sec sm" id="aCsv">Export CSV</button><button class="btn sec sm" id="aReload">Refresh</button></div>
  <div class="kpis"><div class="kpi"><div class="v">${act.length}</div><div class="l">Active staff</div></div><div class="kpi"><div class="v">${complete}</div><div class="l">Fully trained</div></div><div class="kpi ${soon?'warn':''}"><div class="v">${soon}</div><div class="l">Due within 30 days</div></div><div class="kpi ${expired?'bad':''}"><div class="v">${expired}</div><div class="l">Expired items</div></div><div class="kpi ${pend.length?'warn':''}"><div class="v">${pend.length}</div><div class="l">Awaiting approval</div></div></div>
  ${pend.length?`<div class="card" style="margin-bottom:16px"><h3 style="font-size:16px;margin-bottom:8px">Awaiting approval</h3>${pend.map(u=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><div style="flex:1"><b>${esc(u.name)}</b> · ${esc(u.email)} · ${esc(u.phone||'')} · <span class="pill">${u.role==='admin'?'Office/Admin':'DSP'}</span> · registered ${fmtD(u.createdAt)}</div><button class="btn sm" data-approve="${u.id}">Approve</button><button class="btn danger sm" data-deny="${u.id}">Remove</button></div>`).join('')}</div>`:''}
  <div class="scroll"><table class="ros"><thead><tr><th>Staff</th><th>Track</th><th>Progress</th>${MODS.map((m,i)=>`<th class="m" title="${esc(m.title)}">${i+1}. ${esc(m.title)}</th>`).join('')}<th>Credentials</th><th></th></tr></thead><tbody>
  ${rows.map(({u,mods,sts,done})=>`<tr><td><b>${esc(u.name)}</b><br><span style="color:var(--mute);font-size:12px">${esc(u.email)}</span></td><td>${u.role==='admin'?'Office':'DSP'}${u.access==='admin'?' · <span class="pill">admin</span>':''}</td><td><div class="bar" style="width:90px"><i style="width:${Math.round(100*done/mods.length)}%"></i></div><span style="font-size:12px;color:var(--mute)">${done}/${mods.length}</span></td>
  ${MODS.map(m=>{ if(!m.roles.includes(u.role||'dsp')) return '<td class="m"><span class="st na" title="Not in track">·</span></td>'; const s=modStatus(u.progress[m.id],m); const t={na:'—',ip:s.pct+'%',ok:'✓',wn:s.days+'d',ex:'!'}[s.k]; return `<td class="m"><span class="st ${s.k}" title="${esc(s.label)}${s.score!==undefined?' · score '+s.score+'%':''}">${t}</span></td>`; }).join('')}
  <td>${u.creds.length?u.creds.map(c=>{const dl=c.expiresAt?Math.ceil(((c.expiresAt.seconds?c.expiresAt.seconds*1000:c.expiresAt)-Date.now())/DAY):null; return `<span class="pill ${dl===null?'mute':dl<0?'bad':dl<=30?'warn':'ok'}" title="${esc(c.label)} · exp ${fmtD(c.expiresAt)}">${esc(c.label.split(' ')[0])}</span>`}).join(' '):'<span style="color:var(--mute)">—</span>'}</td>
  <td><button class="btn ghost sm" data-edit="${u.id}">Manage</button></td></tr>`).join('')}</tbody></table></div>
  <p style="font-size:12.5px;color:var(--mute);margin-top:10px">Legend: ✓ complete · <b>Nd</b> renew within N days · <b>!</b> expired · % in progress · — not started. Reminder emails go to compliance@havencresthome.com daily when anything is due within 30/14/7 days or expired.</p>`;
  $('#aBack').onclick=homeView; $('#aReload').onclick=adminView;
  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{ busy(true); await updateDoc(doc(db,'users',b.dataset.approve),{access:'active',approvedAt:serverTimestamp(),approvedBy:S.user.email}); busy(false); toast('Approved'); const u=us.find(x=>x.id===b.dataset.approve); u.access='active'; drawAdmin(); });
  document.querySelectorAll('[data-deny]').forEach(b=>b.onclick=async()=>{ const u=us.find(x=>x.id===b.dataset.deny); if(!confirm('Remove '+u.name+'\'s registration? They can register again later.')) return; busy(true); await updateDoc(doc(db,'users',u.id),{access:'disabled'}); busy(false); u.access='disabled'; drawAdmin(); });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>manageUser(us.find(x=>x.id===b.dataset.edit)));
  $('#aCsv').onclick=()=>{ const head=['Name','Email','Phone','Track','Access',...MODS.map(m=>m.title+' status'),...MODS.map(m=>m.title+' completed'),...MODS.map(m=>m.title+' expires'),'Credentials']; const lines=[head]; us.forEach(u=>{ lines.push([u.name,u.email,u.phone||'',u.role,u.access,...MODS.map(m=>modStatus(u.progress[m.id],m).label),...MODS.map(m=>{const p=u.progress[m.id];return p&&p.completedAt?fmtD(p.completedAt):''}),...MODS.map(m=>{const p=u.progress[m.id];return p&&p.expiresAt?fmtD(p.expiresAt):''}),u.creds.map(c=>c.label+' exp '+fmtD(c.expiresAt)).join('; ')]); }); const csv=lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='haven-crest-training-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); };
}
function manageUser(u){
  const d=$('#drawer'); d.classList.add('open');
  const draw=()=>{ $('#pane').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="font-size:20px">${esc(u.name)}</h2><button class="btn ghost sm" id="dClose">Close</button></div>
  <p style="color:var(--mute);margin:4px 0 14px">${esc(u.email)} · ${esc(u.phone||'no phone')} · registered ${fmtD(u.createdAt)}</p>
  <label>Training track</label><select id="uRole"><option value="dsp" ${u.role!=='admin'?'selected':''}>DSP</option><option value="admin" ${u.role==='admin'?'selected':''}>Office / Admin</option></select>
  <label>Portal access</label><select id="uAccess"><option value="active" ${u.access==='active'?'selected':''}>Active staff</option><option value="admin" ${u.access==='admin'?'selected':''}>Administrator</option><option value="pending" ${u.access==='pending'?'selected':''}>Pending</option><option value="disabled" ${u.access==='disabled'?'selected':''}>Disabled</option></select>
  <div class="row" style="margin-top:12px"><button class="btn sm" id="uSave">Save</button></div>
  <h3 style="font-size:15px;margin:22px 0 8px">Modules</h3>
  <table class="ros">${MODS.map(m=>{const s=modStatus(u.progress[m.id],m); const p=u.progress[m.id]||{}; return `<tr><td style="white-space:normal">${esc(m.title)}</td><td><span class="pill ${s.k==='ok'?'ok':s.k==='wn'?'warn':s.k==='ex'?'bad':s.k==='ip'?'':'mute'}">${esc(s.label)}</span></td><td style="font-size:12px;color:var(--mute)">${p.completedAt?'done '+fmtD(p.completedAt)+' · exp '+fmtD(p.expiresAt)+' · '+(p.attempts||1)+' attempt(s)':''}</td><td>${p.completedAt||p.section?`<button class="btn ghost sm" data-reset="${m.id}">Reset</button>`:''}</td></tr>`}).join('')}</table>
  <h3 style="font-size:15px;margin:22px 0 8px">Credentials (CPR/First Aid, background check, TB screen…)</h3>
  ${u.creds.map(c=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><div style="flex:1"><b>${esc(c.label)}</b><br><span style="font-size:12.5px;color:var(--mute)">issued ${fmtD(c.issuedAt)} · expires ${fmtD(c.expiresAt)}${c.note?' · '+esc(c.note):''}</span></div><button class="btn ghost sm" data-delc="${c.id}">Remove</button></div>`).join('')}
  <div class="card" style="margin-top:10px;padding:14px"><label>Credential</label><select id="cType"><option>CPR / First Aid</option><option>Caregiver background check (DHS 12)</option><option>TB / communicable disease screen</option><option>Driver's license & auto insurance</option><option>CNA / other license</option><option>Other</option></select>
  <div class="row"><div style="flex:1"><label>Issued</label><input type="date" id="cIss"></div><div style="flex:1"><label>Expires</label><input type="date" id="cExp"></div></div><label>Note</label><input id="cNote" placeholder="Provider, certificate #, etc."><div class="row" style="margin-top:10px"><button class="btn sm" id="cAdd">Add credential</button></div></div>`;
    $('#dClose').onclick=()=>d.classList.remove('open');
    $('#uSave').onclick=async()=>{ busy(true); const role=$('#uRole').value, access=$('#uAccess').value; await updateDoc(doc(db,'users',u.id),{role,access,updatedAt:serverTimestamp()}); u.role=role; u.access=access; busy(false); toast('Saved'); drawAdmin(); };
    document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{ if(!confirm('Reset this module for '+u.name+'? They will need to retake it.')) return; busy(true); await deleteDoc(doc(db,'progress',u.id,'modules',b.dataset.reset)); delete u.progress[b.dataset.reset]; busy(false); draw(); drawAdmin(); });
    document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=async()=>{ busy(true); await deleteDoc(doc(db,'creds',u.id,'items',b.dataset.delc)); u.creds=u.creds.filter(c=>c.id!==b.dataset.delc); busy(false); draw(); drawAdmin(); });
    $('#cAdd').onclick=async()=>{ const label=$('#cType').value, iss=$('#cIss').value, exp=$('#cExp').value, note=$('#cNote').value; if(!iss) return toast('Enter the issued date'); busy(true); const ref=await addDoc(collection(db,'creds',u.id,'items'),{label,issuedAt:new Date(iss),expiresAt:exp?new Date(exp):null,note,addedBy:S.user.email,addedAt:serverTimestamp()}); u.creds.push({id:ref.id,label,issuedAt:new Date(iss),expiresAt:exp?new Date(exp):null,note}); busy(false); toast('Added'); draw(); drawAdmin(); };
  }; draw();
}

/* ---------- boot ---------- */
async function boot(user){
  S.user=user; busy(true);
  try{
    if(!user.emailVerified){ busy(false); $('#who').innerHTML=`<b>${esc(user.displayName||user.email)}</b>unverified`; $('#btnOut').classList.remove('hide'); return verifyView(); }
    // Security rules read email_verified from the ID token; refresh it once per session so a just-verified account is not denied.
    if(!sessionStorage.getItem('hch_tok')){ try{ await getIdToken(user,true); sessionStorage.setItem('hch_tok','1'); }catch(_){} }
    const ps=await getDoc(doc(db,'users',user.uid));
    if(!ps.exists()){ const isBoot=ADMINS.includes((user.email||'').toLowerCase()); await setDoc(doc(db,'users',user.uid),{name:user.displayName||user.email,email:user.email,phone:'',role:'dsp',access:isBoot?'admin':'pending',createdAt:serverTimestamp()}); S.profile=(await getDoc(doc(db,'users',user.uid))).data(); } else S.profile=ps.data();
    $('#who').innerHTML=`<b>${esc(S.profile.name)}</b>${esc(S.profile.role==='admin'?'Office / Admin':'DSP')}${isAdmin()?' · admin':''}`; $('#btnOut').classList.remove('hide');
    if(S.profile.access==='pending'||S.profile.access==='disabled'){ busy(false); return pendingView(); }
    S.progress=await loadProgress(user.uid); S.creds=await loadCreds(user.uid);
    busy(false);
    const m=(location.hash.match(/#m=(\w+)/)||[])[1]; if(m&&MODS.find(x=>x.id===m)) openModule(m); else if(location.hash==='#admin'&&isAdmin()) adminView(); else homeView();
  }catch(e){ busy(false); $('#app').innerHTML=`<div class="card auth"><h1>Something went wrong</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Reload</button></div>`; }
}
$('#btnOut').onclick=()=>{ sessionStorage.removeItem('hch_tok'); signOut(auth); };
onAuthStateChanged(auth,u=>{ if(u) boot(u); else { S.user=null; S.profile=null; $('#who').innerHTML=''; $('#btnOut').classList.add('hide'); authView(location.hash==='#register'?'register':'login'); } });
</script>
